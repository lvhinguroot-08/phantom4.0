# ==============================================================================
# PHANTOM // Camera Source Configuration & Ingest Registry
# Configures CCTV source streams for Gujarat Police 33 Districts Command Center
# ==============================================================================
# Supported source_type:
#   - CORP8: Official live.corp8.cloud platform (handles 302 redirects & cookies)
#   - HLS: Generic standard HLS / m3u8 stream endpoint
#   - RTSP: Standard RTSP CCTV stream (transcoded to HLS by Stream Gateway)
#   - HTTP: Progressive MP4 / WebM HTTP video stream
#   - TEST_STREAM: Synthetic test card with live UTC time & camera code
# ==============================================================================

version: "1.0"
default_stream_mode: "AUTO" # AUTO = Try external source first, fallback to TEST_STREAM if unreachable

