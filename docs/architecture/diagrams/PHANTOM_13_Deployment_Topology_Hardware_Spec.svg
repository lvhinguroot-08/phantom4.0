<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 540" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="540" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540" /><line x1="40" y1="0" x2="40" y2="540" /><line x1="80" y1="0" x2="80" y2="540" /><line x1="120" y1="0" x2="120" y2="540" /><line x1="160" y1="0" x2="160" y2="540" /><line x1="200" y1="0" x2="200" y2="540" /><line x1="240" y1="0" x2="240" y2="540" /><line x1="280" y1="0" x2="280" y2="540" /><line x1="320" y1="0" x2="320" y2="540" /><line x1="360" y1="0" x2="360" y2="540" /><line x1="400" y1="0" x2="400" y2="540" /><line x1="440" y1="0" x2="440" y2="540" /><line x1="480" y1="0" x2="480" y2="540" /><line x1="520" y1="0" x2="520" y2="540" /><line x1="560" y1="0" x2="560" y2="540" /><line x1="600" y1="0" x2="600" y2="540" /><line x1="640" y1="0" x2="640" y2="540" /><line x1="680" y1="0" x2="680" y2="540" /><line x1="720" y1="0" x2="720" y2="540" /><line x1="760" y1="0" x2="760" y2="540" /><line x1="800" y1="0" x2="800" y2="540" /><line x1="840" y1="0" x2="840" y2="540" /><line x1="880" y1="0" x2="880" y2="540" /><line x1="920" y1="0" x2="920" y2="540" /><line x1="960" y1="0" x2="960" y2="540" /><line x1="1000" y1="0" x2="1000" y2="540" /><line x1="1040" y1="0" x2="1040" y2="540" /><line x1="1080" y1="0" x2="1080" y2="540" /><line x1="1120" y1="0" x2="1120" y2="540" /><line x1="1160" y1="0" x2="1160" y2="540" /><line x1="1200" y1="0" x2="1200" y2="540" /><line x1="1240" y1="0" x2="1240" y2="540" /><line x1="1280" y1="0" x2="1280" y2="540" /><line x1="1320" y1="0" x2="1320" y2="540" /><line x1="1360" y1="0" x2="1360" y2="540" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Deployment Topology & Hardware Engineering Specification</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">Edge compute pods, Netram CCC central cluster, NVIDIA GPU sizing, and Kubernetes orchestration</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Deployment Topology & Hardware Specification -->
    <g transform="translate(0, 30)">
      <!-- Edge Deployment Specification -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="400" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="380" height="24" rx="4" fill="#24124D"/>
        <text x="200" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">1. DISTRICT NETRAM EDGE SPECIFICATION</text>
        
        <g transform="translate(10, 45)">
          <rect width="380" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Hardware Compute Pods (Per District CCC)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• 8x 2U Rack Servers (Dell PowerEdge R760xa / HPE ProLiant DL380)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• 50x NVIDIA L40S (48GB VRAM) / RTX 6000 Ada GPUs</text>
        </g>
        <g transform="translate(10, 120)">
          <rect width="380" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">CPU &amp; System Memory</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• Dual Intel Xeon Gold 6430 (64 Cores / 128 Threads per node)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• 512 GB DDR5-4800 ECC Registered RAM per server</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="380" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Storage &amp; High-Speed Caching</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• 8x 7.68 TB NVMe SSD in RAID-10 for hot alert snapshot storage</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• 200 TB SAS Storage array for 30-day local video retention</text>
        </g>
        <g transform="translate(10, 270)">
          <rect width="380" height="90" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Networking &amp; Edge Resilience</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• Dual 25 GbE SFP28 Optical Uplinks to Gujarat SWAN Network</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• Local NGINX reverse proxy &amp; WHEP WebRTC media gateway</text>
          <text x="10" y="62" fill="#10B981" font-size="9">• Edge continues operating autonomously if WAN uplink drops</text>
        </g>
      </g>

      <path d="M 400 190 L 460 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Central State CCC Specification -->
      <g transform="translate(460, 0)" filter="url(#shadow)">
        <rect width="420" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="400" height="24" rx="4" fill="#24124D"/>
        <text x="210" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">2. CENTRAL STATE CCC SPECIFICATION</text>
        
        <g transform="translate(10, 45)">
          <rect width="400" height="65" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Central Database Cluster</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• 3-Node PostgreSQL 16 + PostGIS cluster with Patroni HA</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• 1 Primary + 2 Synchronous Read Replicas (Sub-millisecond failover)</text>
        </g>
        <g transform="translate(10, 120)">
          <rect width="400" height="65" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">AI Copilot &amp; LLM Inference Server</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• 4x NVIDIA H100 (80GB SXM5) / A100 Tensor Core GPUs</text>
          <text x="10" y="48" fill="#C084FC" font-size="9">• Hosts multilingual Copilot reasoning &amp; embeddings engine</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="400" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Central Event Streaming Bus</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• 5-Broker Apache Kafka cluster (MirrorMaker 2 replication)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• Redis Enterprise Cluster (3-Node Master-Replica Sharded)</text>
        </g>
        <g transform="translate(10, 270)">
          <rect width="400" height="90" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">State Command Wall Streaming</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• 64-Screen Netram video wall controller integration</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• Dynamic multiviewer grid layouts (1x1, 2x2, 4x4, 8x8)</text>
          <text x="10" y="62" fill="#10B981" font-size="9">• Sub-30ms glass-to-wall latency via WebRTC WHEP</text>
        </g>
      </g>

      <path d="M 880 190 L 940 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Container & Cloud Topology -->
      <g transform="translate(940, 0)" filter="url(#shadow)">
        <rect width="360" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="340" height="24" rx="4" fill="#24124D"/>
        <text x="180" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">3. CONTAINER &amp; ORCHESTRATION</text>
        
        <g transform="translate(10, 45)">
          <rect width="340" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Docker &amp; NVIDIA Container Toolkit</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• Base: nvidia/cuda:12.2.0-runtime-ubuntu22.04</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• Full GPU passthrough (--gpus all)</text>
        </g>
        <g transform="translate(10, 120)">
          <rect width="340" height="65" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Kubernetes Deployment Topology</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• Horizontal Pod Autoscaler (HPA) on GPU utilization</text>
          <text x="10" y="48" fill="#C084FC" font-size="9">• K8s DaemonSets for edge stream ingestion workers</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="340" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">CI/CD &amp; Air-Gapped Deployment</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• Fully containerized offline deployment package</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• Works in air-gapped police secure data centers</text>
        </g>
        <g transform="translate(10, 270)">
          <rect width="340" height="90" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Monitoring &amp; Observability</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• Prometheus metrics exporter (/api/v1/health)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• Grafana surveillance operations dashboards</text>
          <text x="10" y="62" fill="#10B981" font-size="9">• Real-time GPU temperature, FPS &amp; VRAM tracking</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>