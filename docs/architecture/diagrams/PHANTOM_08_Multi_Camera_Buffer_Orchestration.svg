<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 540" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="540" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540" /><line x1="40" y1="0" x2="40" y2="540" /><line x1="80" y1="0" x2="80" y2="540" /><line x1="120" y1="0" x2="120" y2="540" /><line x1="160" y1="0" x2="160" y2="540" /><line x1="200" y1="0" x2="200" y2="540" /><line x1="240" y1="0" x2="240" y2="540" /><line x1="280" y1="0" x2="280" y2="540" /><line x1="320" y1="0" x2="320" y2="540" /><line x1="360" y1="0" x2="360" y2="540" /><line x1="400" y1="0" x2="400" y2="540" /><line x1="440" y1="0" x2="440" y2="540" /><line x1="480" y1="0" x2="480" y2="540" /><line x1="520" y1="0" x2="520" y2="540" /><line x1="560" y1="0" x2="560" y2="540" /><line x1="600" y1="0" x2="600" y2="540" /><line x1="640" y1="0" x2="640" y2="540" /><line x1="680" y1="0" x2="680" y2="540" /><line x1="720" y1="0" x2="720" y2="540" /><line x1="760" y1="0" x2="760" y2="540" /><line x1="800" y1="0" x2="800" y2="540" /><line x1="840" y1="0" x2="840" y2="540" /><line x1="880" y1="0" x2="880" y2="540" /><line x1="920" y1="0" x2="920" y2="540" /><line x1="960" y1="0" x2="960" y2="540" /><line x1="1000" y1="0" x2="1000" y2="540" /><line x1="1040" y1="0" x2="1040" y2="540" /><line x1="1080" y1="0" x2="1080" y2="540" /><line x1="1120" y1="0" x2="1120" y2="540" /><line x1="1160" y1="0" x2="1160" y2="540" /><line x1="1200" y1="0" x2="1200" y2="540" /><line x1="1240" y1="0" x2="1240" y2="540" /><line x1="1280" y1="0" x2="1280" y2="540" /><line x1="1320" y1="0" x2="1320" y2="540" /><line x1="1360" y1="0" x2="1360" y2="540" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Multi-Camera Ring Buffer & Thread Isolation Architecture</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">1-Slot decoupled latest-frame buffer, thread isolation, and hardware PTS discontinuity management</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Multi-Camera Decoupled Buffer & Thread Isolation -->
    <g transform="translate(0, 30)">
      <!-- Capture Thread Pool -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="360" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="340" height="24" rx="4" fill="#24124D"/>
        <text x="180" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">INGESTION CAPTURE THREADS</text>
        
        <g transform="translate(10, 45)">
          <rect width="340" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Dedicated Thread per Stream</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">cv2.VideoCapture over TCP (OpenCV)</text>
          <text x="10" y="48" fill="#10B981" font-size="9">Non-blocking continuous frame grab</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="340" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Hardware PTS Timestamp Extractor</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">CAP_PROP_POS_MSEC tracking</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Delta timestamp comparison</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="340" height="85" rx="4" fill="#130826" stroke="#F59E0B" stroke-width="1"/>
          <text x="10" y="20" fill="#F59E0B" font-size="11" font-weight="600">PTS Loop &amp; Discontinuity Handler</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Detects negative jumps (e.g. video loop restart)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Resets active track pool to prevent stale ID drift</text>
          <text x="10" y="62" fill="#F59E0B" font-size="9">Verified by test_scene_discontinuity_and_feed_loop</text>
        </g>
        <g transform="translate(10, 280)">
          <rect width="340" height="80" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="20" fill="#EF4444" font-size="11" font-weight="600">Offline Camera Isolation</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Thread death does not impact adjacent streams</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">2s-&gt;30s exponential reconnect worker</text>
        </g>
      </g>

      <path d="M 360 190 L 420 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Center: 1-Slot Decoupled Ring Buffer -->
      <g transform="translate(420, 0)" filter="url(#shadow)">
        <rect width="380" height="380" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2"/>
        <rect x="10" y="10" width="360" height="24" rx="4" fill="#064E3B"/>
        <text x="190" y="26" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">1-SLOT DECOUPLED RING BUFFER</text>
        
        <g transform="translate(20, 50)">
          <!-- Atomic Buffer Slot Box -->
          <rect width="340" height="110" rx="6" fill="#130826" stroke="#10B981" stroke-width="1.5"/>
          <text x="15" y="24" fill="#10B981" font-size="12" font-weight="700">Atomic Latest-Frame Slot (Per Camera ID)</text>
          <text x="15" y="44" fill="#F5F3FF" font-size="10">Buffer Size: EXACTLY 1 FRAME (Overwrite on arrival)</text>
          <text x="15" y="62" fill="#A78BFA" font-size="9.5">• Ingestion writes new frame -&gt; Overwrites previous unread frame</text>
          <text x="15" y="78" fill="#A78BFA" font-size="9.5">• Inference worker reads frame -&gt; Always gets newest real-time frame</text>
          <text x="15" y="94" fill="#10B981" font-size="9.5">GUARANTEE: Glass-to-inference latency never exceeds 1 frame period</text>
        </g>

        <g transform="translate(20, 180)">
          <rect width="340" height="180" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1"/>
          <text x="15" y="24" fill="#C084FC" font-size="11" font-weight="700">ELIMINATION OF BUFFER BLOAT</text>
          <text x="15" y="46" fill="#F5F3FF" font-size="10">Conventional Queues (FIFO Queue 50 frames):</text>
          <text x="15" y="62" fill="#EF4444" font-size="9">If AI runs at 15 FPS and feed is 25 FPS, latency grows by +1.0s every 2.5s!</text>
          
          <text x="15" y="90" fill="#F5F3FF" font-size="10">PHANTOM 1-Slot Ring Buffer Strategy:</text>
          <text x="15" y="106" fill="#10B981" font-size="9">Intermediate frames naturally dropped with zero memory leaks</text>
          <text x="15" y="122" fill="#10B981" font-size="9">Latency remains constant at &lt; 25ms regardless of GPU load surges</text>
          <text x="15" y="140" fill="#06B6D4" font-size="9">Locking: threading.Lock() with try_acquire for zero thread blocking</text>
        </g>
      </g>

      <path d="M 800 190 L 860 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Right: AI Worker Inference Threads -->
      <g transform="translate(860, 0)" filter="url(#shadow)">
        <rect width="440" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="420" height="24" rx="4" fill="#24124D"/>
        <text x="220" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">AI WORKER &amp; TELEMETRY THREADS</text>
        
        <g transform="translate(10, 45)">
          <rect width="420" height="65" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Shared YOLO26 Detector Singleton</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Single model in GPU VRAM (yolov8n.pt = ~6MB memory footprint)</text>
          <text x="10" y="48" fill="#C084FC" font-size="9">Thread-safe inference execution across multiple camera streams</text>
        </g>
        <g transform="translate(10, 120)">
          <rect width="420" height="65" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Per-Camera YOLO26Tracker Instances</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Independent track ID pools (Track #1 on CAM-001 != Track #1 on CAM-006)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Prevents ID contamination across different physical camera feeds</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="420" height="75" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Asynchronous Database Persistence Worker</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Detections batched and inserted via async SQLAlchemy</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">DB write operations decoupled from real-time video rendering path</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">Verified by test_save_detections_batch unit test</text>
        </g>
        <g transform="translate(10, 280)">
          <rect width="420" height="80" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Real-Time WebSocket HUD Frame Streaming</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Pushes structured detection overlay JSON to Netram control panels</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Sub-20ms broadcast turnaround</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>