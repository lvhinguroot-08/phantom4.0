<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 540" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="540" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540" /><line x1="40" y1="0" x2="40" y2="540" /><line x1="80" y1="0" x2="80" y2="540" /><line x1="120" y1="0" x2="120" y2="540" /><line x1="160" y1="0" x2="160" y2="540" /><line x1="200" y1="0" x2="200" y2="540" /><line x1="240" y1="0" x2="240" y2="540" /><line x1="280" y1="0" x2="280" y2="540" /><line x1="320" y1="0" x2="320" y2="540" /><line x1="360" y1="0" x2="360" y2="540" /><line x1="400" y1="0" x2="400" y2="540" /><line x1="440" y1="0" x2="440" y2="540" /><line x1="480" y1="0" x2="480" y2="540" /><line x1="520" y1="0" x2="520" y2="540" /><line x1="560" y1="0" x2="560" y2="540" /><line x1="600" y1="0" x2="600" y2="540" /><line x1="640" y1="0" x2="640" y2="540" /><line x1="680" y1="0" x2="680" y2="540" /><line x1="720" y1="0" x2="720" y2="540" /><line x1="760" y1="0" x2="760" y2="540" /><line x1="800" y1="0" x2="800" y2="540" /><line x1="840" y1="0" x2="840" y2="540" /><line x1="880" y1="0" x2="880" y2="540" /><line x1="920" y1="0" x2="920" y2="540" /><line x1="960" y1="0" x2="960" y2="540" /><line x1="1000" y1="0" x2="1000" y2="540" /><line x1="1040" y1="0" x2="1040" y2="540" /><line x1="1080" y1="0" x2="1080" y2="540" /><line x1="1120" y1="0" x2="1120" y2="540" /><line x1="1160" y1="0" x2="1160" y2="540" /><line x1="1200" y1="0" x2="1200" y2="540" /><line x1="1240" y1="0" x2="1240" y2="540" /><line x1="1280" y1="0" x2="1280" y2="540" /><line x1="1320" y1="0" x2="1320" y2="540" /><line x1="1360" y1="0" x2="1360" y2="540" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // GIS Spatial Intelligence & CCTV Coverage Wedges</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">Field-of-View wedge polygons, PostGIS spatial indexing, and multi-camera vehicle trajectory prediction</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- GIS Spatial Intelligence & CCTV Wedges -->
    <g transform="translate(0, 30)">
      <!-- Left: Geometry Model -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="440" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="420" height="24" rx="4" fill="#24124D"/>
        <text x="220" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">CCTV COVERAGE WEDGE GEOMETRY MODEL</text>
        
        <g transform="translate(20, 50)">
          <!-- Wedge Drawing -->
          <circle cx="80" cy="120" r="10" fill="#C084FC" filter="url(#glow)"/>
          <text x="80" y="145" fill="#F5F3FF" font-size="10" text-anchor="middle">Camera (lat, lon)</text>
          
          <!-- Optical Wedge Polygon -->
          <path d="M 80 120 L 220 50 A 160 160 0 0 1 220 190 Z" fill="#9333EA" fill-opacity="0.3" stroke="#C084FC" stroke-width="1.5"/>
          <line x1="80" y1="120" x2="230" y2="120" stroke="#A78BFA" stroke-dasharray="3,3" stroke-width="1"/>
          <text x="240" y="124" fill="#A78BFA" font-size="9">Heading θ</text>
          <text x="170" y="110" fill="#C084FC" font-size="9">FOV α (85°)</text>
          <text x="130" y="70" fill="#10B981" font-size="9">Range d (180m)</text>
        </g>

        <g transform="translate(10, 220)">
          <rect width="420" height="140" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="22" fill="#10B981" font-size="11" font-weight="700">Trigonometric Vertex Computation (PostGIS):</text>
          <text x="10" y="42" fill="#F5F3FF" font-size="9.5">Left Wedge Vertex: (lat + d·sin(θ - α/2), lon + d·cos(θ - α/2))</text>
          <text x="10" y="60" fill="#F5F3FF" font-size="9.5">Right Wedge Vertex: (lat + d·sin(θ + α/2), lon + d·cos(θ + α/2))</text>
          <text x="10" y="78" fill="#A78BFA" font-size="9.5">Arc interpolation across 8 ray samples creates visual coverage polygon</text>
          <text x="10" y="96" fill="#06B6D4" font-size="9.5">Enables instant spatial queries: "Find all cameras viewing junction X"</text>
          <text x="10" y="114" fill="#F59E0B" font-size="9.5">Color-coded: Green = Online Live, Red = Offline, Amber = Degraded</text>
        </g>
      </g>

      <path d="M 440 190 L 490 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Right: Multi-Camera Trajectory Interception -->
      <g transform="translate(490, 0)" filter="url(#shadow)">
        <rect width="810" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="790" height="24" rx="4" fill="#24124D"/>
        <text x="405" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">MULTI-CAMERA VEHICLE TRAJECTORY INTERCEPTION</text>
        
        <!-- Map Highway Trajectory Visualization -->
        <g transform="translate(30, 50)">
          <!-- Highway Route Line -->
          <path d="M 50 140 Q 200 40 400 100 T 700 80" fill="none" stroke="#9333EA" stroke-width="4" stroke-dasharray="6,6"/>
          
          <!-- Node 1: SG Highway -->
          <g transform="translate(50, 140)">
            <circle cx="0" cy="0" r="14" fill="#130826" stroke="#EF4444" stroke-width="2" filter="url(#glow)"/>
            <text x="0" y="4" fill="#EF4444" font-size="9" font-weight="800" text-anchor="middle">1</text>
            <text x="0" y="28" fill="#F5F3FF" font-size="10" font-weight="600" text-anchor="middle">CAM-001</text>
            <text x="0" y="40" fill="#A78BFA" font-size="8.5" text-anchor="middle">SG Highway</text>
            <text x="0" y="52" fill="#10B981" font-size="8.5" text-anchor="middle">08:14:22 PM</text>
          </g>

          <!-- Node 2: ISKCON Cross -->
          <g transform="translate(260, 70)">
            <circle cx="0" cy="0" r="14" fill="#130826" stroke="#EF4444" stroke-width="2" filter="url(#glow)"/>
            <text x="0" y="4" fill="#EF4444" font-size="9" font-weight="800" text-anchor="middle">2</text>
            <text x="0" y="28" fill="#F5F3FF" font-size="10" font-weight="600" text-anchor="middle">CAM-006</text>
            <text x="0" y="40" fill="#A78BFA" font-size="8.5" text-anchor="middle">ISKCON Junction</text>
            <text x="0" y="52" fill="#10B981" font-size="8.5" text-anchor="middle">08:21:05 PM</text>
          </g>

          <!-- Node 3: Sanand Cross Road -->
          <g transform="translate(480, 100)">
            <circle cx="0" cy="0" r="14" fill="#130826" stroke="#EF4444" stroke-width="2" filter="url(#glow)"/>
            <text x="0" y="4" fill="#EF4444" font-size="9" font-weight="800" text-anchor="middle">3</text>
            <text x="0" y="28" fill="#F5F3FF" font-size="10" font-weight="600" text-anchor="middle">CAM-013</text>
            <text x="0" y="40" fill="#A78BFA" font-size="8.5" text-anchor="middle">Sanand Highway</text>
            <text x="0" y="52" fill="#10B981" font-size="8.5" text-anchor="middle">08:29:40 PM</text>
          </g>

          <!-- Node 4: Predicted Next Intercept -->
          <g transform="translate(680, 80)">
            <circle cx="0" cy="0" r="16" fill="#130826" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,4" filter="url(#glow)"/>
            <text x="0" y="4" fill="#06B6D4" font-size="9" font-weight="800" text-anchor="middle">4</text>
            <text x="0" y="28" fill="#06B6D4" font-size="10" font-weight="700" text-anchor="middle">PREDICTED INTERCEPT</text>
            <text x="0" y="40" fill="#A78BFA" font-size="8.5" text-anchor="middle">CAM-027 (Bavla Toll)</text>
            <text x="0" y="52" fill="#F59E0B" font-size="8.5" text-anchor="middle">ETA: 08:38:00 PM</text>
          </g>
        </g>

        <!-- Trajectory Intelligence Card -->
        <g transform="translate(20, 240)">
          <rect width="770" height="120" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1"/>
          <text x="15" y="22" fill="#C084FC" font-size="11" font-weight="700">SPATIO-TEMPORAL SPEED &amp; HEADING ESTIMATION</text>
          <text x="15" y="42" fill="#F5F3FF" font-size="9.5">• Calculated Average Speed: 62.4 km/h along Westbound Ahmedabad-Rajkot National Highway (NH-47)</text>
          <text x="15" y="60" fill="#F5F3FF" font-size="9.5">• Target Vehicle: Red Maruti Swift (Plate: GJ01-AB-1234) • Confidence: 94.2% • Sighting Count: 3 CCTVs</text>
          <text x="15" y="78" fill="#06B6D4" font-size="9.5">• AI Copilot Autonomous Action: Alerted District Control Rooms (Ahmedabad Rural &amp; Surendranagar)</text>
          <text x="15" y="96" fill="#10B981" font-size="9.5">• Automatic Toll Gate Alert: Dispatched intercept notification to Bavla Toll Plaza barrier control</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>