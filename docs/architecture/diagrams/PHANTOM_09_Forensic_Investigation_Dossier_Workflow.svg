<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 520" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="520" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="520" /><line x1="40" y1="0" x2="40" y2="520" /><line x1="80" y1="0" x2="80" y2="520" /><line x1="120" y1="0" x2="120" y2="520" /><line x1="160" y1="0" x2="160" y2="520" /><line x1="200" y1="0" x2="200" y2="520" /><line x1="240" y1="0" x2="240" y2="520" /><line x1="280" y1="0" x2="280" y2="520" /><line x1="320" y1="0" x2="320" y2="520" /><line x1="360" y1="0" x2="360" y2="520" /><line x1="400" y1="0" x2="400" y2="520" /><line x1="440" y1="0" x2="440" y2="520" /><line x1="480" y1="0" x2="480" y2="520" /><line x1="520" y1="0" x2="520" y2="520" /><line x1="560" y1="0" x2="560" y2="520" /><line x1="600" y1="0" x2="600" y2="520" /><line x1="640" y1="0" x2="640" y2="520" /><line x1="680" y1="0" x2="680" y2="520" /><line x1="720" y1="0" x2="720" y2="520" /><line x1="760" y1="0" x2="760" y2="520" /><line x1="800" y1="0" x2="800" y2="520" /><line x1="840" y1="0" x2="840" y2="520" /><line x1="880" y1="0" x2="880" y2="520" /><line x1="920" y1="0" x2="920" y2="520" /><line x1="960" y1="0" x2="960" y2="520" /><line x1="1000" y1="0" x2="1000" y2="520" /><line x1="1040" y1="0" x2="1040" y2="520" /><line x1="1080" y1="0" x2="1080" y2="520" /><line x1="1120" y1="0" x2="1120" y2="520" /><line x1="1160" y1="0" x2="1160" y2="520" /><line x1="1200" y1="0" x2="1200" y2="520" /><line x1="1240" y1="0" x2="1240" y2="520" /><line x1="1280" y1="0" x2="1280" y2="520" /><line x1="1320" y1="0" x2="1320" y2="520" /><line x1="1360" y1="0" x2="1360" y2="520" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Forensic Investigation & Certified Dossier Workflow</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">Multi-source search, SHA-256 evidence verification, and Section 65B Indian Evidence Act compliant PDF generation</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Forensic Investigation Dossier Workflow -->
    <g transform="translate(0, 30)">
      <!-- Step 1: Investigation Query -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="280" height="340" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="260" height="24" rx="4" fill="#24124D"/>
        <text x="140" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">1. MULTI-SOURCE SEARCH</text>
        <g transform="translate(10, 45)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Dual Identifier Search</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Search by Plate (e.g. GJ01-AB-1234)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Search by Make/Model (e.g. Red Swift)</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Natural Language NLP Query</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">"Find vehicles near ISKCON between</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">8 PM and 10 PM involved in robbery"</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Spatio-Temporal Bounds</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">District, Camera ID, Date Range</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">PostGIS geometry intersection</text>
        </g>
        <g transform="translate(10, 255)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Multi-Source Aggregator</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Correlates Detections + Alerts +</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Observations into unified sightings</text>
        </g>
      </g>

      <path d="M 280 170 L 330 170" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2: Evidence Verification -->
      <g transform="translate(330, 0)" filter="url(#shadow)">
        <rect width="320" height="340" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="300" height="24" rx="4" fill="#24124D"/>
        <text x="160" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">2. CRYPTOGRAPHIC VERIFICATION</text>
        <g transform="translate(10, 45)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">SHA-256 Hash Validation</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Re-hashes raw crop bytes from disk</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Compares with DB record evidence_hash</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Tamper-Detection Engine</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Endpoint: /api/v1/investigations/verify</text>
          <text x="10" y="48" fill="#10B981" font-size="9">Flags modified / corrupted media</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Chain of Custody Sealing</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Logs capturing camera ID, timestamp,</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">GPS coordinates, and operator credentials</text>
        </g>
        <g transform="translate(10, 255)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">False Positive Override Workflow</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Authorized investigator classification</text>
          <text x="10" y="48" fill="#F59E0B" font-size="9">Audited in system_audit_logs</text>
        </g>
      </g>

      <path d="M 650 170 L 700 170" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 3: Chronological Sighting Graph -->
      <g transform="translate(700, 0)" filter="url(#shadow)">
        <rect width="340" height="340" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="320" height="24" rx="4" fill="#24124D"/>
        <text x="170" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">3. CHRONOLOGICAL TIMELINE GRAPH</text>
        <g transform="translate(10, 45)">
          <rect width="320" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Ordered Sighting Traversal</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Ascending / Descending chronology</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Calculates inter-camera travel time &amp; speed</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="320" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Route Map Plotting</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Connects GPS coordinates on Leaflet GIS</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Visualizes highway escape corridors</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="320" height="60" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">AI Sighting Summary Analytics</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Total sightings count, first seen, last seen,</text>
          <text x="10" y="48" fill="#06B6D4" font-size="9">dominant direction, primary jurisdiction</text>
        </g>
        <g transform="translate(10, 255)">
          <rect width="320" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Cross-District Correlation</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Seamless tracking across Ahmedabad,</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Surat, Vadodara, and Highway Police</text>
        </g>
      </g>

      <path d="M 1040 170 L 1090 170" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 4: Certified Dossier Output -->
      <g transform="translate(1090, 0)" filter="url(#shadow)">
        <rect width="210" height="340" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
        <rect x="10" y="10" width="190" height="24" rx="4" fill="#064E3B"/>
        <text x="105" y="26" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">4. CERTIFIED DOSSIER</text>
        <g transform="translate(10, 45)">
          <rect width="190" height="80" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Section 65B PDF</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Court-admissible certificate</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Embedded SHA-256 hashes</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">Digital officer signature</text>
        </g>
        <g transform="translate(10, 135)">
          <rect width="190" height="80" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">JSON Case Package</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Full structured sighting data</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">GPS waypoint array</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">CCTV camera catalogue IDs</text>
        </g>
        <g transform="translate(10, 225)">
          <rect width="190" height="90" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">C2 Dispatch Egress</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Auto-dispatches case</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">summary to patrolling PCR</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">vans &amp; intercept teams</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>