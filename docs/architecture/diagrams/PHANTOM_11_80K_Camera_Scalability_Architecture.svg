<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 540" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="540" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540" /><line x1="40" y1="0" x2="40" y2="540" /><line x1="80" y1="0" x2="80" y2="540" /><line x1="120" y1="0" x2="120" y2="540" /><line x1="160" y1="0" x2="160" y2="540" /><line x1="200" y1="0" x2="200" y2="540" /><line x1="240" y1="0" x2="240" y2="540" /><line x1="280" y1="0" x2="280" y2="540" /><line x1="320" y1="0" x2="320" y2="540" /><line x1="360" y1="0" x2="360" y2="540" /><line x1="400" y1="0" x2="400" y2="540" /><line x1="440" y1="0" x2="440" y2="540" /><line x1="480" y1="0" x2="480" y2="540" /><line x1="520" y1="0" x2="520" y2="540" /><line x1="560" y1="0" x2="560" y2="540" /><line x1="600" y1="0" x2="600" y2="540" /><line x1="640" y1="0" x2="640" y2="540" /><line x1="680" y1="0" x2="680" y2="540" /><line x1="720" y1="0" x2="720" y2="540" /><line x1="760" y1="0" x2="760" y2="540" /><line x1="800" y1="0" x2="800" y2="540" /><line x1="840" y1="0" x2="840" y2="540" /><line x1="880" y1="0" x2="880" y2="540" /><line x1="920" y1="0" x2="920" y2="540" /><line x1="960" y1="0" x2="960" y2="540" /><line x1="1000" y1="0" x2="1000" y2="540" /><line x1="1040" y1="0" x2="1040" y2="540" /><line x1="1080" y1="0" x2="1080" y2="540" /><line x1="1120" y1="0" x2="1120" y2="540" /><line x1="1160" y1="0" x2="1160" y2="540" /><line x1="1200" y1="0" x2="1200" y2="540" /><line x1="1240" y1="0" x2="1240" y2="540" /><line x1="1280" y1="0" x2="1280" y2="540" /><line x1="1320" y1="0" x2="1320" y2="540" /><line x1="1360" y1="0" x2="1360" y2="540" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // 80,000-Camera State-Wide Scalability Architecture</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">Tiered edge-to-cloud topology, bandwidth optimization math (99.92% savings), and GPU sizing specs</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- 80K Camera State-Wide Scalability Architecture -->
    <g transform="translate(0, 30)">
      <!-- Tier 1: District Edge Clusters -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="380" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="360" height="24" rx="4" fill="#24124D"/>
        <text x="190" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">TIER 1: 33 DISTRICT EDGE NODES</text>
        
        <g transform="translate(10, 45)">
          <rect width="360" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Local CCTV Ingestion (2,400 cams/district)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Direct RTSP TCP pull from junction cameras</text>
          <text x="10" y="48" fill="#10B981" font-size="9">Local 1-slot decoupled ring buffer</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="360" height="65" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Edge YOLO26 TensorRT GPU Pods</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">50 NVIDIA L40S GPUs per District Command Center</text>
          <text x="10" y="48" fill="#C084FC" font-size="9">48 concurrent 1080p streams per GPU @ 15 FPS</text>
        </g>
        <g transform="translate(10, 190)">
          <rect width="360" height="60" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Local EasyOCR ANPR Normalizer</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Performs plate crop &amp; GJ validation at the edge</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Zero raw video transmitted to central CCC</text>
        </g>
        <g transform="translate(10, 260)">
          <rect width="360" height="100" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="700">Bandwidth Reduction Factor:</text>
          <text x="10" y="38" fill="#F5F3FF" font-size="10">Raw Video WAN Egress: 200 Gbps (REDUCED)</text>
          <text x="10" y="56" fill="#10B981" font-size="11" font-weight="800">Edge Metadata WAN Egress: ~154 Mbps</text>
          <text x="10" y="74" fill="#A78BFA" font-size="9.5">99.92% Bandwidth Savings Across State Network</text>
          <text x="10" y="90" fill="#A78BFA" font-size="9">Only alerts, snapshots &amp; metadata leave edge</text>
        </g>
      </g>

      <path d="M 380 190 L 440 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Tier 2: Regional Hubs -->
      <g transform="translate(440, 0)" filter="url(#shadow)">
        <rect width="380" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="360" height="24" rx="4" fill="#24124D"/>
        <text x="190" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">TIER 2: 4 REGIONAL SURVEILLANCE HUBS</text>
        
        <g transform="translate(10, 45)">
          <rect width="360" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Regional Zonal Gateways</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">1. Ahmedabad Zone (25,000 cameras)</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">2. Surat Zone (18,000) • 3. Vadodara (15,000) • 4. Rajkot (22,000)</text>
        </g>
        <g transform="translate(10, 120)">
          <rect width="360" height="65" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Distributed Kafka Event Broker (PLANNED)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">3-Broker cluster per region (48 partitions)</text>
          <text x="10" y="48" fill="#C084FC" font-size="9">Ingests 16,000 detection events/second peak</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="360" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Redis Hot Cache &amp; Watchlist Mirror</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">In-memory plate lookup &amp; 60s cooldown dedup</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Sub-2ms local match response</text>
        </g>
        <g transform="translate(10, 270)">
          <rect width="360" height="90" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Dynamic Video Pull on Demand</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">When officer opens live view or alert triggers,</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">gateway proxies high-res stream via WebRTC WHEP</text>
          <text x="10" y="62" fill="#06B6D4" font-size="9">Bandwidth consumed ONLY for actively viewed feeds</text>
        </g>
      </g>

      <path d="M 820 190 L 880 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Tier 3: State Command Center -->
      <g transform="translate(880, 0)" filter="url(#shadow)">
        <rect width="420" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="400" height="24" rx="4" fill="#24124D"/>
        <text x="210" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">TIER 3: CENTRAL NETRAM CCC (GANDHINAGAR)</text>
        
        <g transform="translate(10, 45)">
          <rect width="400" height="65" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Master PostgreSQL 16 + PostGIS Cluster</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Time-partitioned tables (monthly chunks) • GIST spatial indexing</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Stores 500M+ sightings with sub-50ms query latency</text>
        </g>
        <g transform="translate(10, 120)">
          <rect width="400" height="65" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Central AI Copilot Agent &amp; LLM Engine</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Cross-district natural language reasoning and analytics</text>
          <text x="10" y="48" fill="#C084FC" font-size="9">40+ grounded surveillance tools orchestrator</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="400" height="65" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="20" fill="#EF4444" font-size="11" font-weight="600">Global Watchlist &amp; Incident Matrix</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">State-wide sync to all 33 district edge nodes in &lt;1.0s</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Centralized Section 65B certified dossier repository</text>
        </g>
        <g transform="translate(10, 270)">
          <rect width="400" height="90" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">State Command Wall HUD Broadcasting</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Feeds live video &amp; alert metrics to main video walls</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">DGP &amp; Senior Police leadership oversight dashboard</text>
          <text x="10" y="62" fill="#10B981" font-size="9">Total System Availability: 99.99% Tier-4 Uptime</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>