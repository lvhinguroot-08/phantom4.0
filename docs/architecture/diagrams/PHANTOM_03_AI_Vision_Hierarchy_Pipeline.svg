<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 550" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="550" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="550" /><line x1="40" y1="0" x2="40" y2="550" /><line x1="80" y1="0" x2="80" y2="550" /><line x1="120" y1="0" x2="120" y2="550" /><line x1="160" y1="0" x2="160" y2="550" /><line x1="200" y1="0" x2="200" y2="550" /><line x1="240" y1="0" x2="240" y2="550" /><line x1="280" y1="0" x2="280" y2="550" /><line x1="320" y1="0" x2="320" y2="550" /><line x1="360" y1="0" x2="360" y2="550" /><line x1="400" y1="0" x2="400" y2="550" /><line x1="440" y1="0" x2="440" y2="550" /><line x1="480" y1="0" x2="480" y2="550" /><line x1="520" y1="0" x2="520" y2="550" /><line x1="560" y1="0" x2="560" y2="550" /><line x1="600" y1="0" x2="600" y2="550" /><line x1="640" y1="0" x2="640" y2="550" /><line x1="680" y1="0" x2="680" y2="550" /><line x1="720" y1="0" x2="720" y2="550" /><line x1="760" y1="0" x2="760" y2="550" /><line x1="800" y1="0" x2="800" y2="550" /><line x1="840" y1="0" x2="840" y2="550" /><line x1="880" y1="0" x2="880" y2="550" /><line x1="920" y1="0" x2="920" y2="550" /><line x1="960" y1="0" x2="960" y2="550" /><line x1="1000" y1="0" x2="1000" y2="550" /><line x1="1040" y1="0" x2="1040" y2="550" /><line x1="1080" y1="0" x2="1080" y2="550" /><line x1="1120" y1="0" x2="1120" y2="550" /><line x1="1160" y1="0" x2="1160" y2="550" /><line x1="1200" y1="0" x2="1200" y2="550" /><line x1="1240" y1="0" x2="1240" y2="550" /><line x1="1280" y1="0" x2="1280" y2="550" /><line x1="1320" y1="0" x2="1320" y2="550" /><line x1="1360" y1="0" x2="1360" y2="550" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // AI Vision 3-Tier Hierarchy &amp; Inference Pipeline</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">YOLO26 backbone with specialized Activa/Splendor and WagonR/Swift classifiers and temporal track fusion</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Input Video Feed -->
    <g transform="translate(0, 80)" filter="url(#shadow)">
      <rect width="200" height="280" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
      <rect x="10" y="10" width="180" height="24" rx="4" fill="#24124D"/>
      <text x="100" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">VIDEO INGESTION</text>
      
      <g transform="translate(10, 45)">
        <rect width="180" height="50" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">RTSP / TCP Feed</text>
        <text x="10" y="36" fill="#A78BFA" font-size="9">1080p @ 25 FPS (H.264/H.265)</text>
      </g>
      <g transform="translate(10, 105)">
        <rect width="180" height="50" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
        <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">1-Slot Latest Buffer</text>
        <text x="10" y="36" fill="#A78BFA" font-size="9">Zero backlog frame drop</text>
      </g>
      <g transform="translate(10, 165)">
        <rect width="180" height="50" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">PTS Hardware Delta</text>
        <text x="10" y="36" fill="#A78BFA" font-size="9">Loop discontinuity check</text>
      </g>
    </g>

    <path d="M 200 220 L 250 220" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Shared YOLO26 Backbone Core -->
    <g transform="translate(250, 40)" filter="url(#shadow)">
      <rect width="240" height="360" rx="8" fill="url(#cardGrad)" stroke="#7C3AED" stroke-width="2"/>
      <rect x="10" y="10" width="220" height="24" rx="4" fill="#2E1065"/>
      <text x="120" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">SHARED YOLO26 CORE</text>
      
      <g transform="translate(10, 45)">
        <rect width="220" height="60" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
        <text x="10" y="22" fill="#F5F3FF" font-size="11" font-weight="600">Detector Singleton</text>
        <text x="10" y="38" fill="#A78BFA" font-size="9">yolov8n.pt / ONNX / TensorRT</text>
        <text x="10" y="50" fill="#C084FC" font-size="9">Shared across 30+ streams</text>
      </g>
      <g transform="translate(10, 115)">
        <rect width="220" height="60" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
        <text x="10" y="22" fill="#F5F3FF" font-size="11" font-weight="600">Confidence Threshold</text>
        <text x="10" y="38" fill="#A78BFA" font-size="9">conf_threshold = 0.35</text>
        <text x="10" y="50" fill="#A78BFA" font-size="9">iou_threshold = 0.45</text>
      </g>
      <g transform="translate(10, 185)">
        <rect width="220" height="70" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
        <text x="10" y="22" fill="#F5F3FF" font-size="11" font-weight="600">L1 Base Categories</text>
        <text x="10" y="38" fill="#A78BFA" font-size="9">• Vehicle (Car, Van, SUV)</text>
        <text x="10" y="50" fill="#A78BFA" font-size="9">• Two-Wheeler • Person</text>
        <text x="10" y="62" fill="#A78BFA" font-size="9">• Auto-Rickshaw • Heavy</text>
      </g>
      <g transform="translate(10, 265)">
        <rect width="220" height="50" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
        <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Inference Benchmark</text>
        <text x="10" y="36" fill="#A78BFA" font-size="9">14.2ms GPU / 32ms CPU</text>
      </g>
    </g>

    <!-- Branch to Hierarchical Classifiers -->
    <path d="M 490 140 L 550 80" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 490 220 L 550 220" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 490 300 L 550 360" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- L2/L3 Specialized Classifier Grid -->
    <!-- Two Wheeler Classifier -->
    <g transform="translate(550, 20)" filter="url(#shadow)">
      <rect width="360" height="120" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
      <rect x="10" y="8" width="340" height="22" rx="4" fill="#24124D"/>
      <text x="180" y="23" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">TWO-WHEELER SPECIALIZED CLASSIFIER</text>
      <g transform="translate(10, 36)">
        <rect width="160" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="8" y="18" fill="#F5F3FF" font-size="10" font-weight="600">Honda Activa (Scooter)</text>
        <text x="8" y="32" fill="#A78BFA" font-size="8.5">• Step-through chassis</text>
        <text x="8" y="44" fill="#A78BFA" font-size="8.5">• Small 10/12-inch wheels</text>
        <text x="8" y="56" fill="#10B981" font-size="8.5">Enclosed body panels</text>
      </g>
      <g transform="translate(180, 36)">
        <rect width="160" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="8" y="18" fill="#F5F3FF" font-size="10" font-weight="600">Hero Splendor (Motorcycle)</text>
        <text x="8" y="32" fill="#A78BFA" font-size="8.5">• Top horizontal fuel tank</text>
        <text x="8" y="44" fill="#A78BFA" font-size="8.5">• 18-inch spoked wheels</text>
        <text x="8" y="56" fill="#C084FC" font-size="8.5">Exposed engine bay</text>
      </g>
    </g>

    <!-- Car Specialized Classifier -->
    <g transform="translate(550, 160)" filter="url(#shadow)">
      <rect width="360" height="120" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
      <rect x="10" y="8" width="340" height="22" rx="4" fill="#24124D"/>
      <text x="180" y="23" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">CAR SPECIALIZED CLASSIFIER</text>
      <g transform="translate(10, 36)">
        <rect width="160" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="8" y="18" fill="#F5F3FF" font-size="10" font-weight="600">Maruti WagonR (Tallboy)</text>
        <text x="8" y="32" fill="#A78BFA" font-size="8.5">• Aspect Ratio: 0.85-0.95</text>
        <text x="8" y="44" fill="#A78BFA" font-size="8.5">• Vertical tallboy roofline</text>
        <text x="8" y="56" fill="#10B981" font-size="8.5">High center of gravity</text>
      </g>
      <g transform="translate(180, 36)">
        <rect width="160" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="8" y="18" fill="#F5F3FF" font-size="10" font-weight="600">Maruti Swift (Hatchback)</text>
        <text x="8" y="32" fill="#A78BFA" font-size="8.5">• Aspect Ratio: 0.65-0.78</text>
        <text x="8" y="44" fill="#A78BFA" font-size="8.5">• Sloped aerodynamic roof</text>
        <text x="8" y="56" fill="#C084FC" font-size="8.5">Wide lower track width</text>
      </g>
    </g>

    <!-- Disambiguation & Filtering -->
    <g transform="translate(550, 300)" filter="url(#shadow)">
      <rect width="360" height="120" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
      <rect x="10" y="8" width="340" height="22" rx="4" fill="#24124D"/>
      <text x="180" y="23" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">DISAMBIGUATION &amp; POLE FILTER</text>
      <g transform="translate(10, 36)">
        <rect width="160" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="8" y="18" fill="#F5F3FF" font-size="10" font-weight="600">Auto vs Truck Disambig</text>
        <text x="8" y="32" fill="#A78BFA" font-size="8.5">• Front wheel single taper</text>
        <text x="8" y="44" fill="#A78BFA" font-size="8.5">• Soft canopy texture</text>
        <text x="8" y="56" fill="#F59E0B" font-size="8.5">Resolves 3W vs Mini-Truck</text>
      </g>
      <g transform="translate(180, 36)">
        <rect width="160" height="70" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
        <text x="8" y="18" fill="#EF4444" font-size="10" font-weight="600">Hard Negative Pole Filter</text>
        <text x="8" y="32" fill="#A78BFA" font-size="8.5">• Extreme aspect ratio (&gt;3.2)</text>
        <text x="8" y="44" fill="#A78BFA" font-size="8.5">• Zero optical motion delta</text>
        <text x="8" y="56" fill="#EF4444" font-size="8.5">Eliminates streetlights/signs</text>
      </g>
    </g>

    <!-- Connect to Fusion & Gujarat ANPR -->
    <path d="M 910 80 L 960 180" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 910 220 L 960 220" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 910 360 L 960 260" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Temporal Fusion & Output -->
    <g transform="translate(960, 60)" filter="url(#shadow)">
      <rect width="340" height="320" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
      <rect x="10" y="10" width="320" height="24" rx="4" fill="#064E3B"/>
      <text x="170" y="26" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">TEMPORAL FUSION &amp; HUD OUTPUT</text>

      <g transform="translate(10, 45)">
        <rect width="320" height="55" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
        <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Temporal Track Fusion Engine</text>
        <text x="10" y="35" fill="#A78BFA" font-size="9">IoU track association • Label voting across 5 frames</text>
        <text x="10" y="48" fill="#10B981" font-size="9">Prevents flickering between classes</text>
      </g>
      <g transform="translate(10, 110)">
        <rect width="320" height="55" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
        <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Gujarat ANPR Plate Crop</text>
        <text x="10" y="35" fill="#A78BFA" font-size="9">Bilateral warp &amp; OCR validation</text>
        <text x="10" y="48" fill="#06B6D4" font-size="9">e.g., "GJ01-AB-1234" / "22BH5678AA"</text>
      </g>
      <g transform="translate(10, 175)">
        <rect width="320" height="55" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
        <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">WebSocket Live HUD Broadcast</text>
        <text x="10" y="35" fill="#A78BFA" font-size="9">JSON Schema: track_id, bbox, label, conf, plate</text>
        <text x="10" y="48" fill="#A78BFA" font-size="9">Broadcast to Netram command consoles</text>
      </g>
      <g transform="translate(10, 240)">
        <rect width="320" height="55" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
        <text x="10" y="20" fill="#EF4444" font-size="11" font-weight="600">Watchlist Correlation &amp; Alert Trigger</text>
        <text x="10" y="35" fill="#A78BFA" font-size="9">Exact plate match against wanted/stolen database</text>
        <text x="10" y="48" fill="#EF4444" font-size="9">60s Anti-Storm Cooldown Enforced</text>
      </g>
    </g>
    
  </g>
</svg>