<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 520" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="520" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="520" /><line x1="40" y1="0" x2="40" y2="520" /><line x1="80" y1="0" x2="80" y2="520" /><line x1="120" y1="0" x2="120" y2="520" /><line x1="160" y1="0" x2="160" y2="520" /><line x1="200" y1="0" x2="200" y2="520" /><line x1="240" y1="0" x2="240" y2="520" /><line x1="280" y1="0" x2="280" y2="520" /><line x1="320" y1="0" x2="320" y2="520" /><line x1="360" y1="0" x2="360" y2="520" /><line x1="400" y1="0" x2="400" y2="520" /><line x1="440" y1="0" x2="440" y2="520" /><line x1="480" y1="0" x2="480" y2="520" /><line x1="520" y1="0" x2="520" y2="520" /><line x1="560" y1="0" x2="560" y2="520" /><line x1="600" y1="0" x2="600" y2="520" /><line x1="640" y1="0" x2="640" y2="520" /><line x1="680" y1="0" x2="680" y2="520" /><line x1="720" y1="0" x2="720" y2="520" /><line x1="760" y1="0" x2="760" y2="520" /><line x1="800" y1="0" x2="800" y2="520" /><line x1="840" y1="0" x2="840" y2="520" /><line x1="880" y1="0" x2="880" y2="520" /><line x1="920" y1="0" x2="920" y2="520" /><line x1="960" y1="0" x2="960" y2="520" /><line x1="1000" y1="0" x2="1000" y2="520" /><line x1="1040" y1="0" x2="1040" y2="520" /><line x1="1080" y1="0" x2="1080" y2="520" /><line x1="1120" y1="0" x2="1120" y2="520" /><line x1="1160" y1="0" x2="1160" y2="520" /><line x1="1200" y1="0" x2="1200" y2="520" /><line x1="1240" y1="0" x2="1240" y2="520" /><line x1="1280" y1="0" x2="1280" y2="520" /><line x1="1320" y1="0" x2="1320" y2="520" /><line x1="1360" y1="0" x2="1360" y2="520" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Camera Onboarding & Streaming Lifecycle Architecture</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">Dynamic Sentinel Ingestion (/api/ingest), WebRTC WHEP proxy, and dynamic load pacing profiles</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Camera Onboarding & Streaming Lifecycle -->
    <g transform="translate(0, 30)">
      <!-- Stage 1 -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="280" height="340" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="260" height="24" rx="4" fill="#24124D"/>
        <text x="140" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">1. DISCOVERY &amp; RECONCILIATION</text>
        <g transform="translate(10, 45)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">SentinelCatalogueService</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Polls GET /api/ingest every 60s</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Zero hardcoded camera tables</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">GIS Metadata Association</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Maps lat/lon, heading, FOV</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Ahmedabad, Surat, Vadodara...</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#F59E0B" stroke-width="1"/>
          <text x="10" y="20" fill="#F59E0B" font-size="11" font-weight="600">5-Stage Backoff on HTTP 502</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">2s -&gt; 4s -&gt; 8s -&gt; 16s -&gt; 30s</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Maintains local seeded cache</text>
        </g>
        <g transform="translate(10, 255)">
          <rect width="260" height="60" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Reconciliation Logic</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Adds new cameras on-the-fly</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Marks missing as OFFLINE</text>
        </g>
      </g>

      <path d="M 280 170 L 330 170" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 2 -->
      <g transform="translate(330, 0)" filter="url(#shadow)">
        <rect width="320" height="340" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="300" height="24" rx="4" fill="#24124D"/>
        <text x="160" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">2. STREAM GATEWAY RESOLUTION</text>
        <g transform="translate(10, 45)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Multi-Protocol Proxy Resolver</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">/api/v1/streams/{cam_id}/resolve</text>
          <text x="10" y="48" fill="#10B981" font-size="9">WebRTC (WHEP) primary for browser preview</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">HLS Fallback Generation</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">/api/v1/streams/{cam_id}/live.m3u8</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Low-latency HLS for legacy clients</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">RTSP TCP Ingestion Pipeline</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">rtsp://103.250.160.189:8554/stream/{cam}</text>
          <text x="10" y="48" fill="#06B6D4" font-size="9">OPENCV_FFMPEG_CAPTURE_OPTIONS=tcp</text>
        </g>
        <g transform="translate(10, 255)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Client Session Management</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Tracks UUID sessions &amp; health stats</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Sub-35ms gateway proxy latency</text>
        </g>
      </g>

      <path d="M 650 170 L 700 170" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 3 -->
      <g transform="translate(700, 0)" filter="url(#shadow)">
        <rect width="320" height="340" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="300" height="24" rx="4" fill="#24124D"/>
        <text x="160" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">3. LOAD PACING &amp; PROFILES</text>
        <g transform="translate(10, 45)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">LOW Profile (Operational Preview)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">640x360 @ 10 FPS | 500 kbps</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Used for 100+ multi-camera wall grids</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">MEDIUM Profile (Standard Monitoring)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">1280x720 @ 20 FPS | 1500 kbps</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Standard active surveillance baseline</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">HIGH Profile (Forensic Review)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">1920x1080 @ 25 FPS | 2500 kbps</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">High-definition target inspection</text>
        </g>
        <g transform="translate(10, 255)">
          <rect width="300" height="60" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="20" fill="#EF4444" font-size="11" font-weight="600">BURST_TRACKING Profile</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">1920x1080 @ 30 FPS | 4000 kbps</text>
          <text x="10" y="48" fill="#EF4444" font-size="9">Auto-triggered upon watchlist match</text>
        </g>
      </g>

      <path d="M 1020 170 L 1070 170" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 4 -->
      <g transform="translate(1070, 0)" filter="url(#shadow)">
        <rect width="230" height="340" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
        <rect x="10" y="10" width="210" height="24" rx="4" fill="#064E3B"/>
        <text x="115" y="26" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">4. REAL-TIME AI HUD</text>
        <g transform="translate(10, 45)">
          <rect width="210" height="80" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Live HUD WebSocket</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Multiplexed bounding boxes</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Track ID persistence</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">ANPR license plate badges</text>
        </g>
        <g transform="translate(10, 135)">
          <rect width="210" height="80" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Interactive Controls</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Snapshot download</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">PTZ simulation / Zoom</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">AI Copilot drawer trigger</text>
        </g>
        <g transform="translate(10, 225)">
          <rect width="210" height="90" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Telemetry Monitoring</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Bitrate &amp; FPS meter</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Packet drop alerts</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">Codec: H.264 / H.265 status</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>