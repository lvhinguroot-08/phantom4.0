<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 540" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="540" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540" /><line x1="40" y1="0" x2="40" y2="540" /><line x1="80" y1="0" x2="80" y2="540" /><line x1="120" y1="0" x2="120" y2="540" /><line x1="160" y1="0" x2="160" y2="540" /><line x1="200" y1="0" x2="200" y2="540" /><line x1="240" y1="0" x2="240" y2="540" /><line x1="280" y1="0" x2="280" y2="540" /><line x1="320" y1="0" x2="320" y2="540" /><line x1="360" y1="0" x2="360" y2="540" /><line x1="400" y1="0" x2="400" y2="540" /><line x1="440" y1="0" x2="440" y2="540" /><line x1="480" y1="0" x2="480" y2="540" /><line x1="520" y1="0" x2="520" y2="540" /><line x1="560" y1="0" x2="560" y2="540" /><line x1="600" y1="0" x2="600" y2="540" /><line x1="640" y1="0" x2="640" y2="540" /><line x1="680" y1="0" x2="680" y2="540" /><line x1="720" y1="0" x2="720" y2="540" /><line x1="760" y1="0" x2="760" y2="540" /><line x1="800" y1="0" x2="800" y2="540" /><line x1="840" y1="0" x2="840" y2="540" /><line x1="880" y1="0" x2="880" y2="540" /><line x1="920" y1="0" x2="920" y2="540" /><line x1="960" y1="0" x2="960" y2="540" /><line x1="1000" y1="0" x2="1000" y2="540" /><line x1="1040" y1="0" x2="1040" y2="540" /><line x1="1080" y1="0" x2="1080" y2="540" /><line x1="1120" y1="0" x2="1120" y2="540" /><line x1="1160" y1="0" x2="1160" y2="540" /><line x1="1200" y1="0" x2="1200" y2="540" /><line x1="1240" y1="0" x2="1240" y2="540" /><line x1="1280" y1="0" x2="1280" y2="540" /><line x1="1320" y1="0" x2="1320" y2="540" /><line x1="1360" y1="0" x2="1360" y2="540" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Alert Deduplication & Incident Lifecycle State Machine</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">Anti-storm deduplication cooldown, severity classification, and immutable incident FSM</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Alert Deduplication & Incident Lifecycle State Machine -->
    <g transform="translate(0, 30)">
      <!-- Left: Alert Rules & Dedup -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="400" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="380" height="24" rx="4" fill="#24124D"/>
        <text x="200" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">ALERT RULE ENGINE &amp; DEDUPLICATION</text>
        
        <g transform="translate(10, 45)">
          <rect width="380" height="65" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="20" fill="#EF4444" font-size="11" font-weight="600">Severity Scoring Policy</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">• CRITICAL: Wanted violent offender / high-priority stolen vehicle match</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">• HIGH: Watchlist plate match • MEDIUM: Suspicious dwell • LOW: Traffic anomaly</text>
        </g>
        <g transform="translate(10, 120)">
          <rect width="380" height="65" rx="4" fill="#130826" stroke="#F59E0B" stroke-width="1"/>
          <text x="10" y="20" fill="#F59E0B" font-size="11" font-weight="600">60-Second Anti-Storm Deduplication Cooldown</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Prevents single vehicle from generating 1,500 alerts while in camera view</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Deduplication Key: (camera_id + track_id + plate_number)</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="380" height="65" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Cryptographic Evidence Stamping</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Generates SHA-256 hash of alert frame crop immediately at capture</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Compliant with Section 65B Indian Evidence Act</text>
        </g>
        <g transform="translate(10, 270)">
          <rect width="380" height="85" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">EventPublisher Broadcast</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Broadcasts ALERT_TRIGGERED event over WebSocket bus in &lt;15ms</text>
          <text x="10" y="48" fill="#A78BFA" font-size="9">Triggers audio alarm, HUD flash, and officer dispatch prompt</text>
          <text x="10" y="62" fill="#A78BFA" font-size="9">Auto-promotes camera stream to BURST_TRACKING profile</text>
        </g>
      </g>

      <path d="M 400 190 L 460 190" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Right: Incident Lifecycle State Machine -->
      <g transform="translate(460, 0)" filter="url(#shadow)">
        <rect width="840" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="820" height="24" rx="4" fill="#24124D"/>
        <text x="420" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">INCIDENT LIFECYCLE FINITE STATE MACHINE (FSM)</text>
        
        <!-- State: OPEN -->
        <g transform="translate(30, 70)">
          <rect width="160" height="100" rx="8" fill="#130826" stroke="#EF4444" stroke-width="2"/>
          <text x="80" y="30" fill="#EF4444" font-size="14" font-weight="800" text-anchor="middle">STATE: OPEN</text>
          <text x="80" y="52" fill="#F5F3FF" font-size="10" text-anchor="middle">Alert converted to case</text>
          <text x="80" y="68" fill="#A78BFA" font-size="9" text-anchor="middle">Assigned to Control Room</text>
          <text x="80" y="84" fill="#A78BFA" font-size="9" text-anchor="middle">Awaiting Officer Action</text>
        </g>

        <!-- Arrow Open -> Investigating -->
        <path d="M 190 120 L 250 120" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="220" y="110" fill="#A78BFA" font-size="9" text-anchor="middle">Assign Officer</text>

        <!-- State: INVESTIGATING -->
        <g transform="translate(250, 70)">
          <rect width="180" height="100" rx="8" fill="#130826" stroke="#F59E0B" stroke-width="2"/>
          <text x="90" y="30" fill="#F59E0B" font-size="13" font-weight="800" text-anchor="middle">STATE: INVESTIGATING</text>
          <text x="90" y="52" fill="#F5F3FF" font-size="10" text-anchor="middle">Multi-camera tracking</text>
          <text x="90" y="68" fill="#A78BFA" font-size="9" text-anchor="middle">Officer field dispatch</text>
          <text x="90" y="84" fill="#A78BFA" font-size="9" text-anchor="middle">Case notes logged</text>
        </g>

        <!-- Arrow Investigating -> Resolved -->
        <path d="M 430 120 L 490 120" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="460" y="110" fill="#A78BFA" font-size="9" text-anchor="middle">Apprehend</text>

        <!-- State: RESOLVED -->
        <g transform="translate(490, 70)">
          <rect width="160" height="100" rx="8" fill="#130826" stroke="#06B6D4" stroke-width="2"/>
          <text x="80" y="30" fill="#06B6D4" font-size="13" font-weight="800" text-anchor="middle">STATE: RESOLVED</text>
          <text x="80" y="52" fill="#F5F3FF" font-size="10" text-anchor="middle">Suspect intercepted</text>
          <text x="80" y="68" fill="#A78BFA" font-size="9" text-anchor="middle">Evidence dossier filed</text>
          <text x="80" y="84" fill="#A78BFA" font-size="9" text-anchor="middle">Supervisor review</text>
        </g>

        <!-- Arrow Resolved -> Closed -->
        <path d="M 650 120 L 700 120" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="675" y="110" fill="#A78BFA" font-size="9" text-anchor="middle">Approve</text>

        <!-- State: CLOSED -->
        <g transform="translate(700, 70)">
          <rect width="120" height="100" rx="8" fill="#130826" stroke="#10B981" stroke-width="2"/>
          <text x="60" y="30" fill="#10B981" font-size="13" font-weight="800" text-anchor="middle">STATE: CLOSED</text>
          <text x="60" y="52" fill="#F5F3FF" font-size="10" text-anchor="middle">Case archived</text>
          <text x="60" y="68" fill="#A78BFA" font-size="9" text-anchor="middle">Audit trail sealed</text>
          <text x="60" y="84" fill="#10B981" font-size="9" text-anchor="middle">Complete</text>
        </g>

        <!-- False Positive Loop -->
        <path d="M 340 170 L 340 220 L 760 220 L 760 170" stroke="#EF4444" stroke-dasharray="4,4" stroke-width="1.5" marker-end="url(#arrow-red)"/>
        <text x="550" y="240" fill="#EF4444" font-size="10" text-anchor="middle">Dismiss as False Positive (Requires mandatory justification note)</text>

        <!-- Governance Footer in Card -->
        <g transform="translate(30, 260)">
          <rect width="790" height="95" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1"/>
          <text x="15" y="22" fill="#C084FC" font-size="11" font-weight="700">MANDATORY AUDIT COMPLIANCE CONTROLS</text>
          <text x="15" y="42" fill="#F5F3FF" font-size="10">• Every state transition requires active officer ID, timestamp, and signed justification note</text>
          <text x="15" y="58" fill="#F5F3FF" font-size="10">• State changes trigger immutable audit log insertion into PostgreSQL system_audit_logs table</text>
          <text x="15" y="74" fill="#F5F3FF" font-size="10">• Certified PDF case dossier is automatically compiled upon reaching RESOLVED or CLOSED state</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>