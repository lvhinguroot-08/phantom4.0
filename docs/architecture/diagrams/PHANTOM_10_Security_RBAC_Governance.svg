<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 540" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="540" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540" /><line x1="40" y1="0" x2="40" y2="540" /><line x1="80" y1="0" x2="80" y2="540" /><line x1="120" y1="0" x2="120" y2="540" /><line x1="160" y1="0" x2="160" y2="540" /><line x1="200" y1="0" x2="200" y2="540" /><line x1="240" y1="0" x2="240" y2="540" /><line x1="280" y1="0" x2="280" y2="540" /><line x1="320" y1="0" x2="320" y2="540" /><line x1="360" y1="0" x2="360" y2="540" /><line x1="400" y1="0" x2="400" y2="540" /><line x1="440" y1="0" x2="440" y2="540" /><line x1="480" y1="0" x2="480" y2="540" /><line x1="520" y1="0" x2="520" y2="540" /><line x1="560" y1="0" x2="560" y2="540" /><line x1="600" y1="0" x2="600" y2="540" /><line x1="640" y1="0" x2="640" y2="540" /><line x1="680" y1="0" x2="680" y2="540" /><line x1="720" y1="0" x2="720" y2="540" /><line x1="760" y1="0" x2="760" y2="540" /><line x1="800" y1="0" x2="800" y2="540" /><line x1="840" y1="0" x2="840" y2="540" /><line x1="880" y1="0" x2="880" y2="540" /><line x1="920" y1="0" x2="920" y2="540" /><line x1="960" y1="0" x2="960" y2="540" /><line x1="1000" y1="0" x2="1000" y2="540" /><line x1="1040" y1="0" x2="1040" y2="540" /><line x1="1080" y1="0" x2="1080" y2="540" /><line x1="1120" y1="0" x2="1120" y2="540" /><line x1="1160" y1="0" x2="1160" y2="540" /><line x1="1200" y1="0" x2="1200" y2="540" /><line x1="1240" y1="0" x2="1240" y2="540" /><line x1="1280" y1="0" x2="1280" y2="540" /><line x1="1320" y1="0" x2="1320" y2="540" /><line x1="1360" y1="0" x2="1360" y2="540" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Security, RBAC Matrix & Governance Architecture</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">7-Role granular permissions, JWT lifecycle, SSRF protection, and Section 65B tamper-evident audit trail</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Security, RBAC & Governance Architecture -->
    <g transform="translate(0, 30)">
      <!-- 7-Role Granular RBAC Matrix -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="520" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="500" height="24" rx="4" fill="#24124D"/>
        <text x="260" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">7-ROLE GRANULAR ROLE-BASED ACCESS CONTROL (RBAC)</text>
        
        <g transform="translate(15, 45)">
          <rect width="490" height="40" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="12" y="18" fill="#EF4444" font-size="10" font-weight="700">SYSTEM_ADMIN</text>
          <text x="12" y="32" fill="#A78BFA" font-size="8.5">Full system provisioning, user CRUD, camera sources, system audit trail inspection</text>
        </g>
        <g transform="translate(15, 90)">
          <rect width="490" height="40" rx="4" fill="#130826" stroke="#F59E0B" stroke-width="1"/>
          <text x="12" y="18" fill="#F59E0B" font-size="10" font-weight="700">POLICE_OFFICER</text>
          <text x="12" y="32" fill="#A78BFA" font-size="8.5">Live CCTV grid monitoring, watchlist registration, alert dispatch, incident state transition</text>
        </g>
        <g transform="translate(15, 135)">
          <rect width="490" height="40" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="12" y="18" fill="#06B6D4" font-size="10" font-weight="700">INVESTIGATOR</text>
          <text x="12" y="32" fill="#A78BFA" font-size="8.5">Case dossier generation, historical ANPR query, certified evidence SHA-256 export</text>
        </g>
        <g transform="translate(15, 180)">
          <rect width="490" height="40" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="12" y="18" fill="#F5F3FF" font-size="10" font-weight="700">ANALYST</text>
          <text x="12" y="32" fill="#A78BFA" font-size="8.5">Statistical dashboards, traffic density heatmaps, detection metrics &amp; AI model accuracy review</text>
        </g>
        <g transform="translate(15, 225)">
          <rect width="490" height="40" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="12" y="18" fill="#F5F3FF" font-size="10" font-weight="700">VIEWER</text>
          <text x="12" y="32" fill="#A78BFA" font-size="8.5">Read-only live video and GIS map access (Strictly restricted from mutations &amp; exports)</text>
        </g>
        <g transform="translate(15, 270)">
          <rect width="490" height="40" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="12" y="18" fill="#10B981" font-size="10" font-weight="700">AUDITOR</text>
          <text x="12" y="32" fill="#A78BFA" font-size="8.5">Immutable security audit log inspection, compliance reporting, chain-of-custody verification</text>
        </g>
        <g transform="translate(15, 315)">
          <rect width="490" height="45" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="12" y="18" fill="#C084FC" font-size="10" font-weight="700">AI_WORKER (Machine-to-Machine)</text>
          <text x="12" y="32" fill="#A78BFA" font-size="8.5">Inference telemetry ingestion, automated event publication, edge worker authentication</text>
        </g>
      </g>

      <!-- Right: Security Mechanisms & Governance -->
      <g transform="translate(560, 0)" filter="url(#shadow)">
        <rect width="740" height="380" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="720" height="24" rx="4" fill="#24124D"/>
        <text x="370" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">GOVERNANCE &amp; HARDENED SECURITY STACK</text>
        
        <g transform="translate(15, 45)">
          <rect width="345" height="90" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="12" y="20" fill="#F5F3FF" font-size="11" font-weight="600">JWT Token Lifecycle (HS256)</text>
          <text x="12" y="36" fill="#A78BFA" font-size="9">• 8-Hour expiration with revocation list</text>
          <text x="12" y="50" fill="#A78BFA" font-size="9">• Verified against active user status in DB</text>
          <text x="12" y="64" fill="#10B981" font-size="9">• Strict Bearer scheme enforcement</text>
        </g>
        <g transform="translate(370, 45)">
          <rect width="345" height="90" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="12" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Password Hashing Security</text>
          <text x="12" y="36" fill="#A78BFA" font-size="9">• Passlib PBKDF2-SHA256 &amp; Bcrypt</text>
          <text x="12" y="50" fill="#A78BFA" font-size="9">• 29,000 salt rounds calculation</text>
          <text x="12" y="64" fill="#10B981" font-size="9">• Zero plaintext credential leakage</text>
        </g>

        <g transform="translate(15, 145)">
          <rect width="345" height="95" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="12" y="20" fill="#EF4444" font-size="11" font-weight="600">SSRF &amp; Metadata Protection</text>
          <text x="12" y="36" fill="#A78BFA" font-size="9">• Blocks cloud metadata (169.254.169.254)</text>
          <text x="12" y="50" fill="#A78BFA" font-size="9">• Restricts external stream URLs to whitelist</text>
          <text x="12" y="64" fill="#A78BFA" font-size="9">• Validates IP octets &amp; private subnets</text>
          <text x="12" y="78" fill="#EF4444" font-size="9">• Verified by test_ssrf_cloud_metadata_rejection</text>
        </g>
        <g transform="translate(370, 145)">
          <rect width="345" height="95" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="12" y="20" fill="#06B6D4" font-size="11" font-weight="600">Security Headers Middleware</text>
          <text x="12" y="36" fill="#A78BFA" font-size="9">• X-Content-Type-Options: nosniff</text>
          <text x="12" y="50" fill="#A78BFA" font-size="9">• X-Frame-Options: DENY (Anti-Clickjacking)</text>
          <text x="12" y="64" fill="#A78BFA" font-size="9">• Content-Security-Policy: default-src 'self'</text>
          <text x="12" y="78" fill="#06B6D4" font-size="9">• Rate-limiting headers: X-RateLimit-Limit</text>
        </g>

        <g transform="translate(15, 250)">
          <rect width="700" height="110" rx="4" fill="#180C33" stroke="#10B981" stroke-width="1"/>
          <text x="15" y="22" fill="#10B981" font-size="11" font-weight="700">IMMUTABLE SECURITY AUDIT LOGGING</text>
          <text x="15" y="42" fill="#F5F3FF" font-size="9.5">• Every API mutation (camera added, watchlist entry created, incident state changed) is logged</text>
          <text x="15" y="60" fill="#F5F3FF" font-size="9.5">• Audit records store: User ID, Action, IP Address, HTTP Method, Endpoint, Timestamp, and Payload Hash</text>
          <text x="15" y="78" fill="#F5F3FF" font-size="9.5">• Audit trail is append-only in database (UPDATE and DELETE statements blocked by trigger)</text>
          <text x="15" y="96" fill="#10B981" font-size="9.5">• Verified by test_audit_log_endpoint_immutability unit test</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>