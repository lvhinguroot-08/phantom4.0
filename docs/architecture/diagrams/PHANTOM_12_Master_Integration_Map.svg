<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 580" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="580" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="580" /><line x1="40" y1="0" x2="40" y2="580" /><line x1="80" y1="0" x2="80" y2="580" /><line x1="120" y1="0" x2="120" y2="580" /><line x1="160" y1="0" x2="160" y2="580" /><line x1="200" y1="0" x2="200" y2="580" /><line x1="240" y1="0" x2="240" y2="580" /><line x1="280" y1="0" x2="280" y2="580" /><line x1="320" y1="0" x2="320" y2="580" /><line x1="360" y1="0" x2="360" y2="580" /><line x1="400" y1="0" x2="400" y2="580" /><line x1="440" y1="0" x2="440" y2="580" /><line x1="480" y1="0" x2="480" y2="580" /><line x1="520" y1="0" x2="520" y2="580" /><line x1="560" y1="0" x2="560" y2="580" /><line x1="600" y1="0" x2="600" y2="580" /><line x1="640" y1="0" x2="640" y2="580" /><line x1="680" y1="0" x2="680" y2="580" /><line x1="720" y1="0" x2="720" y2="580" /><line x1="760" y1="0" x2="760" y2="580" /><line x1="800" y1="0" x2="800" y2="580" /><line x1="840" y1="0" x2="840" y2="580" /><line x1="880" y1="0" x2="880" y2="580" /><line x1="920" y1="0" x2="920" y2="580" /><line x1="960" y1="0" x2="960" y2="580" /><line x1="1000" y1="0" x2="1000" y2="580" /><line x1="1040" y1="0" x2="1040" y2="580" /><line x1="1080" y1="0" x2="1080" y2="580" /><line x1="1120" y1="0" x2="1120" y2="580" /><line x1="1160" y1="0" x2="1160" y2="580" /><line x1="1200" y1="0" x2="1200" y2="580" /><line x1="1240" y1="0" x2="1240" y2="580" /><line x1="1280" y1="0" x2="1280" y2="580" /><line x1="1320" y1="0" x2="1320" y2="580" /><line x1="1360" y1="0" x2="1360" y2="580" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" /><line x1="0" y1="520" x2="1380" y2="520" /><line x1="0" y1="560" x2="1380" y2="560" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Master Component & API Integration Map</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">Complete cross-system interconnect diagram between FastAPI v1 backend, core services, and React 18 UI</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- Master Component Integration Map -->
    <g transform="translate(0, 30)">
      <!-- Backend Routers -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="360" height="420" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="340" height="24" rx="4" fill="#24124D"/>
        <text x="180" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">FASTAPI V1 ROUTER MAPPING (23 ENDPOINTS)</text>
        
        <g transform="translate(10, 45)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="22" fill="#F5F3FF" font-size="10">/api/v1/auth &amp; /users • JWT &amp; 7-Role RBAC</text>
        </g>
        <g transform="translate(10, 85)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="22" fill="#F5F3FF" font-size="10">/api/v1/cameras • Discovery, CRUD &amp; Health</text>
        </g>
        <g transform="translate(10, 125)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="22" fill="#F5F3FF" font-size="10">/api/v1/streams • WHEP, HLS &amp; Resolution Resolvers</text>
        </g>
        <g transform="translate(10, 165)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="22" fill="#EF4444" font-size="10">/api/v1/alerts &amp; /watchlists • Anti-Storm &amp; Plates</text>
        </g>
        <g transform="translate(10, 205)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="22" fill="#F5F3FF" font-size="10">/api/v1/incidents • Lifecycle FSM State Updates</text>
        </g>
        <g transform="translate(10, 245)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="22" fill="#06B6D4" font-size="10">/api/v1/investigations • Sighting Graph &amp; Dossiers</text>
        </g>
        <g transform="translate(10, 285)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="22" fill="#F5F3FF" font-size="10">/api/v1/gis • FOV Coverage Wedges &amp; Trajectory</text>
        </g>
        <g transform="translate(10, 325)">
          <rect width="340" height="35" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="22" fill="#C084FC" font-size="10">/api/v1/copilot • Grounded Multi-Tool Agent</text>
        </g>
        <g transform="translate(10, 365)">
          <rect width="340" height="40" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="22" fill="#10B981" font-size="10">/api/v1/audit &amp; /health • Sec 65B Logs &amp; Metrics</text>
        </g>
      </g>

      <path d="M 360 210 L 420 210" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Core Domain Services -->
      <g transform="translate(420, 0)" filter="url(#shadow)">
        <rect width="440" height="420" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="420" height="24" rx="4" fill="#24124D"/>
        <text x="220" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">CORE ASYNC DOMAIN SERVICES</text>
        
        <g transform="translate(10, 45)">
          <rect width="420" height="50" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">StreamGatewayService &amp; ProfileManager</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Manages WHEP proxy, RTSP TCP sockets, HLS playlist workers</text>
        </g>
        <g transform="translate(10, 105)">
          <rect width="420" height="50" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">SentinelCatalogueService</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Background sync loop, Corp8 adapter discovery, 5-stage backoff</text>
        </g>
        <g transform="translate(10, 165)">
          <rect width="420" height="50" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="20" fill="#EF4444" font-size="11" font-weight="600">AlertEngine &amp; Cooldown Registry</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Severity calculator, 60s cooldown cache, watchlist matcher</text>
        </g>
        <g transform="translate(10, 225)">
          <rect width="420" height="50" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">InvestigationDossierService</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Chronological sighting aggregator, SHA-256 evidence validation</text>
        </g>
        <g transform="translate(10, 285)">
          <rect width="420" height="50" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">SurveillanceCopilot &amp; Tool Registry</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">40+ grounded tools, multilingual NLP engine, execution graph</text>
        </g>
        <g transform="translate(10, 345)">
          <rect width="420" height="60" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">EventPublisher &amp; MultiStreamYOLO26Manager</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">WebSocket broadcaster, decoupled 1-slot latest frame buffers</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Hardware PTS delta tracking &amp; loop reset handling</text>
        </g>
      </g>

      <path d="M 860 210 L 920 210" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Frontend React 18 Architecture -->
      <g transform="translate(920, 0)" filter="url(#shadow)">
        <rect width="380" height="420" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="360" height="24" rx="4" fill="#24124D"/>
        <text x="190" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">FRONTEND CLIENT (REACT 18 + VITE)</text>
        
        <g transform="translate(10, 45)">
          <rect width="360" height="45" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="10" font-weight="600">LiveGridPage &amp; WebRTC Player</text>
          <text x="10" y="34" fill="#A78BFA" font-size="8.5">WHEP video player + real-time canvas bounding box HUD</text>
        </g>
        <g transform="translate(10, 95)">
          <rect width="360" height="45" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="10" font-weight="600">GISMapPage &amp; Leaflet Overlays</text>
          <text x="10" y="34" fill="#A78BFA" font-size="8.5">CCTV coverage wedges, vehicle trajectory path lines</text>
        </g>
        <g transform="translate(10, 145)">
          <rect width="360" height="45" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="20" fill="#EF4444" font-size="10" font-weight="600">AlertsPage &amp; Incident Console</text>
          <text x="10" y="34" fill="#A78BFA" font-size="8.5">Audio alarm, priority filtering, one-click dispatch modal</text>
        </g>
        <g transform="translate(10, 195)">
          <rect width="360" height="45" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="10" font-weight="600">InvestigationsPage &amp; Dossier Viewer</text>
          <text x="10" y="34" fill="#A78BFA" font-size="8.5">Chronological sighting viewer, SHA-256 verification badge</text>
        </g>
        <g transform="translate(10, 245)">
          <rect width="360" height="45" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#C084FC" font-size="10" font-weight="600">AICopilotDrawer (EN, HI, GU)</text>
          <text x="10" y="34" fill="#A78BFA" font-size="8.5">Conversational drawer with quick prompts &amp; map sync</text>
        </g>
        <g transform="translate(10, 295)">
          <rect width="360" height="45" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="10" font-weight="600">WatchlistsPage &amp; AuditLogsPage</text>
          <text x="10" y="34" fill="#A78BFA" font-size="8.5">Plate registration, category tags, immutable audit table</text>
        </g>
        <g transform="translate(10, 345)">
          <rect width="360" height="60" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="10" font-weight="600">State Management (Zustand + React Query)</text>
          <text x="10" y="34" fill="#A78BFA" font-size="8.5">useAuthStore, useCameraStore, useAlertStore, useWebSocket</text>
          <text x="10" y="48" fill="#10B981" font-size="8.5">Zero unnecessary re-renders across 60 FPS updates</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>