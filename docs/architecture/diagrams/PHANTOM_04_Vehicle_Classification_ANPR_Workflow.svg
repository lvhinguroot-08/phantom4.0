<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 500" width="100%" height="100%" style="background:#090414; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0624" />
      <stop offset="50%" stop-color="#160A36" />
      <stop offset="100%" stop-color="#090317" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#120729" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1380" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="500" /><line x1="40" y1="0" x2="40" y2="500" /><line x1="80" y1="0" x2="80" y2="500" /><line x1="120" y1="0" x2="120" y2="500" /><line x1="160" y1="0" x2="160" y2="500" /><line x1="200" y1="0" x2="200" y2="500" /><line x1="240" y1="0" x2="240" y2="500" /><line x1="280" y1="0" x2="280" y2="500" /><line x1="320" y1="0" x2="320" y2="500" /><line x1="360" y1="0" x2="360" y2="500" /><line x1="400" y1="0" x2="400" y2="500" /><line x1="440" y1="0" x2="440" y2="500" /><line x1="480" y1="0" x2="480" y2="500" /><line x1="520" y1="0" x2="520" y2="500" /><line x1="560" y1="0" x2="560" y2="500" /><line x1="600" y1="0" x2="600" y2="500" /><line x1="640" y1="0" x2="640" y2="500" /><line x1="680" y1="0" x2="680" y2="500" /><line x1="720" y1="0" x2="720" y2="500" /><line x1="760" y1="0" x2="760" y2="500" /><line x1="800" y1="0" x2="800" y2="500" /><line x1="840" y1="0" x2="840" y2="500" /><line x1="880" y1="0" x2="880" y2="500" /><line x1="920" y1="0" x2="920" y2="500" /><line x1="960" y1="0" x2="960" y2="500" /><line x1="1000" y1="0" x2="1000" y2="500" /><line x1="1040" y1="0" x2="1040" y2="500" /><line x1="1080" y1="0" x2="1080" y2="500" /><line x1="1120" y1="0" x2="1120" y2="500" /><line x1="1160" y1="0" x2="1160" y2="500" /><line x1="1200" y1="0" x2="1200" y2="500" /><line x1="1240" y1="0" x2="1240" y2="500" /><line x1="1280" y1="0" x2="1280" y2="500" /><line x1="1320" y1="0" x2="1320" y2="500" /><line x1="1360" y1="0" x2="1360" y2="500" />
    <line x1="0" y1="0" x2="1380" y2="0" /><line x1="0" y1="40" x2="1380" y2="40" /><line x1="0" y1="80" x2="1380" y2="80" /><line x1="0" y1="120" x2="1380" y2="120" /><line x1="0" y1="160" x2="1380" y2="160" /><line x1="0" y1="200" x2="1380" y2="200" /><line x1="0" y1="240" x2="1380" y2="240" /><line x1="0" y1="280" x2="1380" y2="280" /><line x1="0" y1="320" x2="1380" y2="320" /><line x1="0" y1="360" x2="1380" y2="360" /><line x1="0" y1="400" x2="1380" y2="400" /><line x1="0" y1="440" x2="1380" y2="440" /><line x1="0" y1="480" x2="1380" y2="480" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#9333EA" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" fill="#C084FC" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHANTOM 4.8</text>
    
    <text x="135" y="18" fill="#F5F3FF" font-size="20" font-weight="800" letter-spacing="0.5">PHANTOM // Vehicle Localization & Gujarat ANPR Normalization Flow</text>
    <text x="135" y="40" fill="#A78BFA" font-size="12" font-weight="400">End-to-end OCR processing with Gujarat RTO code validation (GJ01-GJ38) and Bharat Series compliance</text>

    <!-- Gujarat Police Netram Tag -->
    <g transform="translate(1040, 0)">
      <rect x="0" y="0" width="220" height="34" rx="6" fill="#180C33" stroke="#4C1D95" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10B981" filter="url(#glow)" />
      <text x="34" y="21" fill="#F5F3FF" font-size="11" font-weight="600">GUJARAT POLICE NETRAM C2</text>
    </g>
  </g>

  <!-- Main Diagram Body -->
  <g transform="translate(40, 95)">
    
    <!-- ANPR Pipeline Stages -->
    <g transform="translate(0, 30)">
      <!-- Stage 1 -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="240" height="320" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="220" height="24" rx="4" fill="#24124D"/>
        <text x="120" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">1. VEHICLE LOCALIZATION</text>
        <g transform="translate(10, 45)">
          <rect width="220" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">YOLO26 Bounding Box</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Extracts target vehicle bbox</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Calculates sub-region plate ROI</text>
        </g>
        <g transform="translate(10, 125)">
          <rect width="220" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Lower Bumper Cropping</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Indian HSRP plate geometry</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Front/Rear bumper zone scan</text>
        </g>
        <g transform="translate(10, 205)">
          <rect width="220" height="90" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Contrast Pre-Check</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Standard yellow/white plate</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Green EV plate detection</text>
          <text x="10" y="64" fill="#A78BFA" font-size="9">Commercial vs Private type</text>
        </g>
      </g>

      <path d="M 240 160 L 280 160" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 2 -->
      <g transform="translate(280, 0)" filter="url(#shadow)">
        <rect width="240" height="320" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="220" height="24" rx="4" fill="#24124D"/>
        <text x="120" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">2. IMAGE ENHANCEMENT</text>
        <g transform="translate(10, 45)">
          <rect width="220" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Bilateral Smoothing</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Preserves crisp character edges</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Removes road dust &amp; sensor noise</text>
        </g>
        <g transform="translate(10, 125)">
          <rect width="220" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Perspective Rectification</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">4-point homography transform</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">De-skews acute CCTV angles</text>
        </g>
        <g transform="translate(10, 205)">
          <rect width="220" height="90" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Adaptive Thresholding</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Otsu binarization</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Day/Night headlight tolerance</text>
          <text x="10" y="64" fill="#A78BFA" font-size="9">Sharpened character glyphs</text>
        </g>
      </g>

      <path d="M 520 160 L 560 160" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 3 -->
      <g transform="translate(560, 0)" filter="url(#shadow)">
        <rect width="240" height="320" rx="8" fill="url(#cardGrad)" stroke="#4C1D95" stroke-width="1.5"/>
        <rect x="10" y="10" width="220" height="24" rx="4" fill="#24124D"/>
        <text x="120" y="26" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">3. OCR RECOGNITION</text>
        <g transform="translate(10, 45)">
          <rect width="220" height="70" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">EasyOCR Deep Engine</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">PyTorch CRAFT detection</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">ResNet + BiLSTM recognition</text>
        </g>
        <g transform="translate(10, 125)">
          <rect width="220" height="70" rx="4" fill="#130826" stroke="#4C1D95" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Font Invariance</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Handles stylized fonts</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Standard Indian IND plates</text>
        </g>
        <g transform="translate(10, 205)">
          <rect width="220" height="90" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Character Confidence</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Per-character softmax scores</text>
          <text x="10" y="50" fill="#A78BFA" font-size="9">Aggregates overall plate score</text>
          <text x="10" y="64" fill="#A78BFA" font-size="9">Rejection if score &lt; 0.60</text>
        </g>
      </g>

      <path d="M 800 160 L 840 160" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 4 -->
      <g transform="translate(840, 0)" filter="url(#shadow)">
        <rect width="460" height="320" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5"/>
        <rect x="10" y="10" width="440" height="24" rx="4" fill="#064E3B"/>
        <text x="230" y="26" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">4. GUJARAT RTO &amp; BHARAT SERIES NORMALIZATION</text>
        
        <g transform="translate(10, 45)">
          <rect width="440" height="60" rx="4" fill="#130826" stroke="#10B981" stroke-width="1"/>
          <text x="10" y="20" fill="#10B981" font-size="11" font-weight="600">Gujarat RTO District Code Mapper (GJ-01 to GJ-38)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">GJ01 (Ahmedabad City), GJ05 (Surat), GJ06 (Vadodara), GJ03 (Rajkot), GJ27 (Ahmedabad Rural)</text>
          <text x="10" y="48" fill="#F5F3FF" font-size="9">Regex Pattern: ^GJ[0-3][0-9][A-Z]{1,3}[0-9]{1,4}$</text>
        </g>
        <g transform="translate(10, 115)">
          <rect width="440" height="60" rx="4" fill="#130826" stroke="#06B6D4" stroke-width="1"/>
          <text x="10" y="20" fill="#06B6D4" font-size="11" font-weight="600">Indian Bharat Series Parser (22BH...AA)</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Support for Central Govt &amp; Inter-State Bharat Series Plates</text>
          <text x="10" y="48" fill="#F5F3FF" font-size="9">Regex Pattern: ^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$</text>
        </g>
        <g transform="translate(10, 185)">
          <rect width="440" height="60" rx="4" fill="#130826" stroke="#7C3AED" stroke-width="1"/>
          <text x="10" y="20" fill="#F5F3FF" font-size="11" font-weight="600">Character Disambiguation Heuristics</text>
          <text x="10" y="35" fill="#A78BFA" font-size="9">Replaces 'O' &lt;-&gt; '0', 'I' &lt;-&gt; '1', 'B' &lt;-&gt; '8' based on structural position rules</text>
          <text x="10" y="48" fill="#C084FC" font-size="9">Ensures 99.4% normalization accuracy on noisy feeds</text>
        </g>
        <g transform="translate(10, 255)">
          <rect width="440" height="50" rx="4" fill="#130826" stroke="#EF4444" stroke-width="1"/>
          <text x="10" y="20" fill="#EF4444" font-size="11" font-weight="600">Immediate Watchlist Query &amp; Audit Logging</text>
          <text x="10" y="36" fill="#A78BFA" font-size="9">Emits detection event to DB with normalized plate string</text>
        </g>
      </g>
    </g>
    
  </g>
</svg>