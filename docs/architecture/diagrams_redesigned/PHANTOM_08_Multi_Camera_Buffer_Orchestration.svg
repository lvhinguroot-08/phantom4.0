<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0522" />
      <stop offset="50%" stop-color="#14092E" />
      <stop offset="100%" stop-color="#080316" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#100624" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="860" height="820" fill="url(#bgGrad)" rx="8" />
  
  <!-- Precision Technical Grid -->
  <g opacity="0.03" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="820" /><line x1="40" y1="0" x2="40" y2="820" /><line x1="80" y1="0" x2="80" y2="820" /><line x1="120" y1="0" x2="120" y2="820" /><line x1="160" y1="0" x2="160" y2="820" /><line x1="200" y1="0" x2="200" y2="820" /><line x1="240" y1="0" x2="240" y2="820" /><line x1="280" y1="0" x2="280" y2="820" /><line x1="320" y1="0" x2="320" y2="820" /><line x1="360" y1="0" x2="360" y2="820" /><line x1="400" y1="0" x2="400" y2="820" /><line x1="440" y1="0" x2="440" y2="820" /><line x1="480" y1="0" x2="480" y2="820" /><line x1="520" y1="0" x2="520" y2="820" /><line x1="560" y1="0" x2="560" y2="820" /><line x1="600" y1="0" x2="600" y2="820" /><line x1="640" y1="0" x2="640" y2="820" /><line x1="680" y1="0" x2="680" y2="820" /><line x1="720" y1="0" x2="720" y2="820" /><line x1="760" y1="0" x2="760" y2="820" /><line x1="800" y1="0" x2="800" y2="820" /><line x1="840" y1="0" x2="840" y2="820" />
    <line x1="0" y1="0" x2="860" y2="0" /><line x1="0" y1="40" x2="860" y2="40" /><line x1="0" y1="80" x2="860" y2="80" /><line x1="0" y1="120" x2="860" y2="120" /><line x1="0" y1="160" x2="860" y2="160" /><line x1="0" y1="200" x2="860" y2="200" /><line x1="0" y1="240" x2="860" y2="240" /><line x1="0" y1="280" x2="860" y2="280" /><line x1="0" y1="320" x2="860" y2="320" /><line x1="0" y1="360" x2="860" y2="360" /><line x1="0" y1="400" x2="860" y2="400" /><line x1="0" y1="440" x2="860" y2="440" /><line x1="0" y1="480" x2="860" y2="480" /><line x1="0" y1="520" x2="860" y2="520" /><line x1="0" y1="560" x2="860" y2="560" /><line x1="0" y1="600" x2="860" y2="600" /><line x1="0" y1="640" x2="860" y2="640" /><line x1="0" y1="680" x2="860" y2="680" /><line x1="0" y1="720" x2="860" y2="720" /><line x1="0" y1="760" x2="860" y2="760" /><line x1="0" y1="800" x2="860" y2="800" />
  </g>
  <rect width="860" height="820" fill="none" stroke="#6D28D9" stroke-width="1.5" rx="8" />
  
  <!-- Diagram Content -->
  
    <!-- Title Card -->
    <g transform="translate(30, 20)" filter="url(#shadow)">
      <rect width="800" height="85" rx="8" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.8" />
      <text x="20" y="32" fill="#FFFFFF" font-size="14.5" font-weight="800">DECOUPLED 1-SLOT LATEST FRAME RING BUFFER ARCHITECTURE</text>
      <text x="20" y="52" fill="#C4B5FD" font-size="11">Eliminates inference lag accumulation, guarantees zero buffer bloat, and provides complete camera thread isolation</text>
      <text x="20" y="70" fill="#06B6D4" font-size="10.5" font-weight="600">MultiStreamYOLO26Manager (`backend/app/services/multi_stream_yolo26_manager.py`)</text>
    </g>
    
    <!-- Camera 1 Stream Pipeline -->
    <g transform="translate(30, 125)" filter="url(#shadow)">
      <rect width="800" height="175" rx="8" fill="url(#cardGrad)" stroke="#6D28D9" stroke-width="1.5" />
      <rect x="0" y="0" width="800" height="30" rx="8" fill="#1A0D3D" />
      <text x="16" y="20" fill="#FFFFFF" font-size="11.5" font-weight="700">CAMERA STREAM 01 // AHMEDABAD SG HIGHWAY (ACTIVE &amp; HEALTHY)</text>
      
      <!-- Thread 1: Ingest -->
      <g transform="translate(20, 45)">
        <rect width="200" height="110" rx="6" fill="#0C041C" stroke="#10B981" stroke-width="1.5" />
        <text x="14" y="22" fill="#10B981" font-size="10.5" font-weight="700">CAPTURE THREAD #1</text>
        <text x="14" y="40" fill="#FFFFFF" font-size="9">• RTSP over TCP Reader</text>
        <text x="14" y="56" fill="#FFFFFF" font-size="9">• 25 FPS continuous pull</text>
        <text x="14" y="72" fill="#C4B5FD" font-size="8.5">• Hardware PTS tracking</text>
        <text x="14" y="94" fill="#10B981" font-size="9" font-weight="700">Status: HEALTHY (25 fps)</text>
      </g>
      
      <path d="M 220 100 L 265 100" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr-green)" />
      
      <!-- 1-Slot Buffer -->
      <g transform="translate(265, 45)">
        <rect width="240" height="110" rx="6" fill="#0C041C" stroke="#F59E0B" stroke-width="2" />
        <text x="14" y="22" fill="#F59E0B" font-size="10.5" font-weight="800">1-SLOT RING BUFFER #1</text>
        
        <rect x="14" y="32" width="212" height="42" rx="4" fill="#1C1004" stroke="#F59E0B" stroke-width="1" />
        <text x="120" y="48" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">LATEST FRAME SLOT</text>
        <text x="120" y="64" fill="#F59E0B" font-size="8.5" text-anchor="middle">Always holds frame N (Silent Overwrite)</text>
        
        <text x="14" y="90" fill="#C4B5FD" font-size="8.5">• Queue length = EXACTLY 1</text>
        <text x="14" y="103" fill="#10B981" font-size="8.5" font-weight="700">• ZERO BUFFER BLOAT (Sub-20ms)</text>
      </g>
      
      <path d="M 505 100 L 550 100" stroke="#C084FC" stroke-width="2.5" marker-end="url(#arr)" />
      
      <!-- Worker Thread -->
      <g transform="translate(550, 45)">
        <rect width="230" height="110" rx="6" fill="#0C041C" stroke="#C084FC" stroke-width="1.5" />
        <text x="14" y="22" fill="#C084FC" font-size="10.5" font-weight="700">INFERENCE WORKER THREAD</text>
        <text x="14" y="40" fill="#FFFFFF" font-size="9">• Grabs latest frame from slot</text>
        <text x="14" y="56" fill="#FFFFFF" font-size="9">• Executes YOLO26 + ANPR</text>
        <text x="14" y="72" fill="#C4B5FD" font-size="8.5">• Inference latency: 16.4ms</text>
        <text x="14" y="94" fill="#06B6D4" font-size="9" font-weight="700">Egress: WebSocket Broadcast</text>
      </g>
    </g>
    
    <!-- Camera 2 Stream Pipeline (Demonstrating Thread Isolation on Failure) -->
    <g transform="translate(30, 320)" filter="url(#shadow)">
      <rect width="800" height="175" rx="8" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5" />
      <rect x="0" y="0" width="800" height="30" rx="8" fill="#330A1C" />
      <text x="16" y="20" fill="#FFFFFF" font-size="11.5" font-weight="700">CAMERA STREAM 02 // SURAT RING ROAD (PACKET DROP / NETWORK TIMEOUT)</text>
      
      <!-- Thread 2: Timeout -->
      <g transform="translate(20, 45)">
        <rect width="200" height="110" rx="6" fill="#0C041C" stroke="#EF4444" stroke-width="1.5" />
        <text x="14" y="22" fill="#EF4444" font-size="10.5" font-weight="700">CAPTURE THREAD #2</text>
        <text x="14" y="40" fill="#EF4444" font-size="9">• Network Socket Timeout</text>
        <text x="14" y="56" fill="#C4B5FD" font-size="9">• 5.0s read deadline reached</text>
        <text x="14" y="72" fill="#F59E0B" font-size="8.5">• Backoff retry 2s -> 4s</text>
        <text x="14" y="94" fill="#EF4444" font-size="9" font-weight="700">Status: RECONNECTING</text>
      </g>
      
      <path d="M 220 100 L 265 100" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4" />
      
      <!-- 1-Slot Buffer Discard -->
      <g transform="translate(265, 45)">
        <rect width="240" height="110" rx="6" fill="#0C041C" stroke="#EF4444" stroke-width="1.5" />
        <text x="14" y="22" fill="#EF4444" font-size="10.5" font-weight="800">1-SLOT BUFFER ISOLATION</text>
        
        <rect x="14" y="32" width="212" height="42" rx="4" fill="#200610" stroke="#EF4444" stroke-width="1" />
        <text x="120" y="48" fill="#EF4444" font-size="10" font-weight="700" text-anchor="middle">STALE SLOT DROPPED</text>
        <text x="120" y="64" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Zero frames queued; no stall</text>
        
        <text x="14" y="90" fill="#C4B5FD" font-size="8.5">• Thread sleeps peacefully</text>
        <text x="14" y="103" fill="#10B981" font-size="8.5" font-weight="700">• ZERO IMPACT ON CAM 01 OR 03</text>
      </g>
      
      <path d="M 505 100 L 550 100" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="4,4" />
      
      <!-- Worker Thread unaffected -->
      <g transform="translate(550, 45)">
        <rect width="230" height="110" rx="6" fill="#0C041C" stroke="#10B981" stroke-width="1.5" />
        <text x="14" y="22" fill="#10B981" font-size="10.5" font-weight="700">SHARED GPU WORKER POOL</text>
        <text x="14" y="40" fill="#FFFFFF" font-size="9">• Unaffected by Cam 02 drop</text>
        <text x="14" y="56" fill="#FFFFFF" font-size="9">• Processes other 47 streams</text>
        <text x="14" y="72" fill="#C4B5FD" font-size="8.5">• No deadlock, no GPU freeze</text>
        <text x="14" y="94" fill="#10B981" font-size="9" font-weight="700">Worker health: 100% NOMINAL</text>
      </g>
    </g>
    
    <!-- Part 3: PTS Discontinuity Detection & Track Pool Reset -->
    <g transform="translate(30, 515)" filter="url(#shadow)">
      <rect width="800" height="245" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#2E1805" />
      <text x="20" y="23" fill="#F59E0B" font-size="13" font-weight="800">HARDWARE PTS DELTA DISCONTINUITY DETECTION &amp; TRACK POOL RESET</text>
      
      <g transform="translate(20, 48)">
        <rect width="365" height="180" rx="6" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="16" y="24" fill="#FFFFFF" font-size="11" font-weight="700">THE VIDEO LOOP / PTS DRIFT PROBLEM</text>
        <text x="16" y="44" fill="#C4B5FD" font-size="9.5">• Synthetic camera feeds or looped MP4/RTSP streams</text>
        <text x="16" y="60" fill="#C4B5FD" font-size="9.5">  jump presentation timestamp (PTS) back to 0.0s</text>
        <text x="16" y="76" fill="#C4B5FD" font-size="9.5">• In legacy systems, this causes severe identity drift:</text>
        <text x="16" y="92" fill="#EF4444" font-size="9.5">  Old vehicle track IDs fuse into newly looped cars</text>
        <text x="16" y="112" fill="#C4B5FD" font-size="9.5">• Generates false trajectory alerts and corrupted dossiers</text>
        <text x="16" y="136" fill="#F59E0B" font-size="10" font-weight="700">PHANTOM Delta Trigger:</text>
        <text x="16" y="154" fill="#FFFFFF" font-family="monospace" font-size="9.5">if (current_pts - last_pts) &lt; -1.0s:</text>
      </g>
      
      <g transform="translate(415, 48)">
        <rect width="365" height="180" rx="6" fill="#0C041C" stroke="#10B981" stroke-width="1" />
        <text x="16" y="24" fill="#10B981" font-size="11" font-weight="700">AUTOMATIC TRACK POOL FLUSH</text>
        <text x="16" y="44" fill="#FFFFFF" font-size="9.5">1. Timestamp Discontinuity Flagged:</text>
        <text x="16" y="60" fill="#06B6D4" font-size="9">   logger.warning("PTS jump detected on camera %s", cam_id)</text>
        
        <text x="16" y="82" fill="#FFFFFF" font-size="9.5">2. Clears Active Track Pool:</text>
        <text x="16" y="98" fill="#C4B5FD" font-size="9">   tracker.reset_tracks(camera_id)</text>
        
        <text x="16" y="120" fill="#FFFFFF" font-size="9.5">3. Fresh Track IDs Allocated:</text>
        <text x="16" y="136" fill="#C4B5FD" font-size="9">   Next frame initiates clean tracking sequence</text>
        <text x="16" y="160" fill="#10B981" font-size="9.5" font-weight="700">Result: ZERO identity drift across looped feeds</text>
      </g>
    </g>
</svg>