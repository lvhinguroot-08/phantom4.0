<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0522" />
      <stop offset="50%" stop-color="#14092E" />
      <stop offset="100%" stop-color="#080316" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#100624" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="860" height="820" fill="url(#bgGrad)" rx="8" />
  
  <!-- Precision Technical Grid -->
  <g opacity="0.03" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="820" /><line x1="40" y1="0" x2="40" y2="820" /><line x1="80" y1="0" x2="80" y2="820" /><line x1="120" y1="0" x2="120" y2="820" /><line x1="160" y1="0" x2="160" y2="820" /><line x1="200" y1="0" x2="200" y2="820" /><line x1="240" y1="0" x2="240" y2="820" /><line x1="280" y1="0" x2="280" y2="820" /><line x1="320" y1="0" x2="320" y2="820" /><line x1="360" y1="0" x2="360" y2="820" /><line x1="400" y1="0" x2="400" y2="820" /><line x1="440" y1="0" x2="440" y2="820" /><line x1="480" y1="0" x2="480" y2="820" /><line x1="520" y1="0" x2="520" y2="820" /><line x1="560" y1="0" x2="560" y2="820" /><line x1="600" y1="0" x2="600" y2="820" /><line x1="640" y1="0" x2="640" y2="820" /><line x1="680" y1="0" x2="680" y2="820" /><line x1="720" y1="0" x2="720" y2="820" /><line x1="760" y1="0" x2="760" y2="820" /><line x1="800" y1="0" x2="800" y2="820" /><line x1="840" y1="0" x2="840" y2="820" />
    <line x1="0" y1="0" x2="860" y2="0" /><line x1="0" y1="40" x2="860" y2="40" /><line x1="0" y1="80" x2="860" y2="80" /><line x1="0" y1="120" x2="860" y2="120" /><line x1="0" y1="160" x2="860" y2="160" /><line x1="0" y1="200" x2="860" y2="200" /><line x1="0" y1="240" x2="860" y2="240" /><line x1="0" y1="280" x2="860" y2="280" /><line x1="0" y1="320" x2="860" y2="320" /><line x1="0" y1="360" x2="860" y2="360" /><line x1="0" y1="400" x2="860" y2="400" /><line x1="0" y1="440" x2="860" y2="440" /><line x1="0" y1="480" x2="860" y2="480" /><line x1="0" y1="520" x2="860" y2="520" /><line x1="0" y1="560" x2="860" y2="560" /><line x1="0" y1="600" x2="860" y2="600" /><line x1="0" y1="640" x2="860" y2="640" /><line x1="0" y1="680" x2="860" y2="680" /><line x1="0" y1="720" x2="860" y2="720" /><line x1="0" y1="760" x2="860" y2="760" /><line x1="0" y1="800" x2="860" y2="800" />
  </g>
  <rect width="860" height="820" fill="none" stroke="#6D28D9" stroke-width="1.5" rx="8" />
  
  <!-- Diagram Content -->
  
    <!-- Part 1: Alert Deduplication Pipeline -->
    <g transform="translate(30, 20)" filter="url(#shadow)">
      <rect width="800" height="235" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.8" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#2E1B0A" />
      <text x="20" y="23" fill="#F59E0B" font-size="13" font-weight="800">1. ALERT DEDUPLICATION &amp; 60-SECOND ANTI-STORM COOLDOWN</text>
      
      <!-- Pipeline Steps -->
      <g transform="translate(20, 50)">
        <rect width="230" height="165" rx="6" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="16" y="24" fill="#FFFFFF" font-size="11" font-weight="700">DETECTION INGESTION</text>
        <text x="16" y="44" fill="#C4B5FD" font-size="9.5">• Ingests YOLO26 detection</text>
        <text x="16" y="60" fill="#C4B5FD" font-size="9.5">• Persistent Track ID</text>
        <text x="16" y="76" fill="#C4B5FD" font-size="9.5">• Normalized Plate string</text>
        <text x="16" y="92" fill="#C4B5FD" font-size="9.5">• Vehicle Class &amp; Make</text>
        <text x="16" y="116" fill="#06B6D4" font-size="9.5" font-weight="700">Generates Sighting Key:</text>
        <text x="16" y="134" fill="#FFFFFF" font-family="monospace" font-size="9">key = f"{cam}:{track_id}"</text>
      </g>
      
      <path d="M 250 132 L 290 132" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr)" />
      
      <g transform="translate(290, 50)">
        <rect width="250" height="165" rx="6" fill="#0C041C" stroke="#F59E0B" stroke-width="1.5" />
        <text x="16" y="24" fill="#F59E0B" font-size="11" font-weight="700">60s SLIDING COOLDOWN WINDOW</text>
        <text x="16" y="44" fill="#FFFFFF" font-size="9.5">• Checks in-memory Redis/Dict:</text>
        <text x="16" y="62" fill="#C4B5FD" font-size="9.5">  if (now - last_alert) &lt; 60.0s:</text>
        <text x="16" y="80" fill="#EF4444" font-size="10" font-weight="700">  -> SUPPRESS (Drop Alert)</text>
        <text x="16" y="98" fill="#C4B5FD" font-size="9.5">  else:</text>
        <text x="16" y="116" fill="#10B981" font-size="10" font-weight="700">  -> EMIT &amp; UPDATE TIMESTAMP</text>
        <text x="16" y="140" fill="#C4B5FD" font-size="8.5">Eliminates 98.4% alert storm spam</text>
      </g>
      
      <path d="M 540 132 L 580 132" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr-green)" />
      
      <g transform="translate(580, 50)">
        <rect width="200" height="165" rx="6" fill="#0C041C" stroke="#10B981" stroke-width="1" />
        <text x="16" y="24" fill="#10B981" font-size="11" font-weight="700">CRYPTOGRAPHIC EVIDENCE</text>
        <text x="16" y="44" fill="#FFFFFF" font-size="9.5">SHA-256 Hashing:</text>
        <text x="16" y="62" fill="#06B6D4" font-size="9" font-family="monospace">hashlib.sha256(crop)</text>
        <text x="16" y="82" fill="#C4B5FD" font-size="9.5">• Binds crop to alert</text>
        <text x="16" y="98" fill="#C4B5FD" font-size="9.5">• Tamper-evident proof</text>
        <text x="16" y="116" fill="#C4B5FD" font-size="9.5">• Section 65B compliant</text>
        <text x="16" y="140" fill="#FFFFFF" font-size="8.5">Stored in Alert Record</text>
      </g>
    </g>
    
    <path d="M 430 255 L 430 285" stroke="#9333EA" stroke-width="2.5" marker-end="url(#arr)" />
    
    <!-- Part 2: Incident Lifecycle Finite State Machine (FSM) -->
    <g transform="translate(30, 285)" filter="url(#shadow)">
      <rect width="800" height="475" rx="8" fill="url(#cardGrad)" stroke="#9333EA" stroke-width="2" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#1C0E42" />
      <text x="20" y="23" fill="#FFFFFF" font-size="13" font-weight="800">2. FORMAL INCIDENT LIFECYCLE FINITE STATE MACHINE (FSM)</text>
      
      <!-- State 1: OPEN -->
      <g transform="translate(35, 60)">
        <rect width="165" height="145" rx="8" fill="#160826" stroke="#EF4444" stroke-width="2" />
        <circle cx="24" cy="24" r="7" fill="#EF4444" filter="url(#subtleGlow)" />
        <text x="82" y="28" fill="#EF4444" font-size="13" font-weight="800" text-anchor="middle">OPEN</text>
        
        <text x="14" y="56" fill="#FFFFFF" font-size="9.5" font-weight="700">Initial Trigger State</text>
        <text x="14" y="74" fill="#C4B5FD" font-size="9">• Watchlist match hit</text>
        <text x="14" y="90" fill="#C4B5FD" font-size="9">• Audio alarm ringing</text>
        <text x="14" y="106" fill="#C4B5FD" font-size="9">• Dispatch unassigned</text>
        <text x="14" y="126" fill="#F59E0B" font-size="9" font-weight="700">SLA: &lt; 30s response</text>
      </g>
      
      <!-- Transition 1 -> 2 -->
      <path d="M 200 132 L 240 132" stroke="#06B6D4" stroke-width="2.5" marker-end="url(#arr-cyan)" />
      <text x="220" y="124" fill="#06B6D4" font-size="9" font-weight="700" text-anchor="middle">ASSIGN</text>
      
      <!-- State 2: INVESTIGATING -->
      <g transform="translate(240, 60)">
        <rect width="165" height="145" rx="8" fill="#160826" stroke="#06B6D4" stroke-width="2" />
        <circle cx="24" cy="24" r="7" fill="#06B6D4" filter="url(#subtleGlow)" />
        <text x="95" y="28" fill="#06B6D4" font-size="12" font-weight="800" text-anchor="middle">INVESTIGATING</text>
        
        <text x="14" y="56" fill="#FFFFFF" font-size="9.5" font-weight="700">Officer Review Active</text>
        <text x="14" y="74" fill="#C4B5FD" font-size="9">• Officer assigned</text>
        <text x="14" y="90" fill="#C4B5FD" font-size="9">• Live stream preview</text>
        <text x="14" y="106" fill="#C4B5FD" font-size="9">• Trajectory tracking</text>
        <text x="14" y="126" fill="#10B981" font-size="9" font-weight="700">BURST stream active</text>
      </g>
      
      <!-- Transition 2 -> 3 -->
      <path d="M 405 132 L 445 132" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr-green)" />
      <text x="425" y="124" fill="#10B981" font-size="9" font-weight="700" text-anchor="middle">RESOLVE</text>
      
      <!-- State 3: RESOLVED -->
      <g transform="translate(445, 60)">
        <rect width="165" height="145" rx="8" fill="#160826" stroke="#10B981" stroke-width="2" />
        <circle cx="24" cy="24" r="7" fill="#10B981" filter="url(#subtleGlow)" />
        <text x="90" y="28" fill="#10B981" font-size="12" font-weight="800" text-anchor="middle">RESOLVED</text>
        
        <text x="14" y="56" fill="#FFFFFF" font-size="9.5" font-weight="700">Field Action Complete</text>
        <text x="14" y="74" fill="#C4B5FD" font-size="9">• Vehicle intercepted OR</text>
        <text x="14" y="90" fill="#C4B5FD" font-size="9">• False positive marked</text>
        <text x="14" y="106" fill="#C4B5FD" font-size="9">• Mandatory notes filed</text>
        <text x="14" y="126" fill="#FFFFFF" font-size="9" font-weight="700">Officer Badge Logged</text>
      </g>
      
      <!-- Transition 3 -> 4 -->
      <path d="M 610 132 L 640 132" stroke="#9333EA" stroke-width="2.5" marker-end="url(#arr)" />
      <text x="625" y="124" fill="#C084FC" font-size="9" font-weight="700" text-anchor="middle">CLOSE</text>
      
      <!-- State 4: CLOSED -->
      <g transform="translate(640, 60)">
        <rect width="135" height="145" rx="8" fill="#160826" stroke="#C4B5FD" stroke-width="2" />
        <circle cx="20" cy="24" r="7" fill="#C4B5FD" />
        <text x="75" y="28" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">CLOSED</text>
        
        <text x="12" y="56" fill="#FFFFFF" font-size="9.5" font-weight="700">Case Archived</text>
        <text x="12" y="74" fill="#C4B5FD" font-size="9">• Dossier exported</text>
        <text x="12" y="90" fill="#C4B5FD" font-size="9">• Evidence sealed</text>
        <text x="12" y="106" fill="#C4B5FD" font-size="9">• Read-only audit</text>
        <text x="12" y="126" fill="#10B981" font-size="9" font-weight="700">Immutable record</text>
      </g>
      
      <!-- Feedback / Reopen Transition -->
      <path d="M 527 205 L 527 235 L 117 235 L 117 205" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" />
      <text x="322" y="230" fill="#F59E0B" font-size="9" font-weight="700" text-anchor="middle">RE-OPEN ON NEW SIGHTING OR DISPUTE</text>
      
      <!-- FSM Rules & Security Controls Matrix (Bottom half) -->
      <g transform="translate(20, 255)">
        <rect width="760" height="200" rx="6" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="16" y="24" fill="#06B6D4" font-size="11.5" font-weight="800">GOVERNANCE &amp; AUDIT ENFORCEMENT RULES:</text>
        
        <g transform="translate(16, 38)">
          <rect width="350" height="70" rx="4" fill="#130826" stroke="#2B1050" stroke-width="1" />
          <text x="12" y="20" fill="#FFFFFF" font-size="10" font-weight="700">Role-Based Mutation Restrictions</text>
          <text x="12" y="36" fill="#C4B5FD" font-size="9">• Only POLICE_OFFICER or INVESTIGATOR can resolve</text>
          <text x="12" y="50" fill="#C4B5FD" font-size="9">• VIEWER and AUDITOR roles cannot alter FSM state</text>
          <text x="12" y="64" fill="#10B981" font-size="9">Enforced via FastAPI Depends(require_role)</text>
        </g>
        
        <g transform="translate(385, 38)">
          <rect width="360" height="70" rx="4" fill="#130826" stroke="#2B1050" stroke-width="1" />
          <text x="12" y="20" fill="#FFFFFF" font-size="10" font-weight="700">Mandatory Officer Justification Notes</text>
          <text x="12" y="36" fill="#C4B5FD" font-size="9">• RESOLVED state requires min 20 character note</text>
          <text x="12" y="50" fill="#C4B5FD" font-size="9">• Captures officer ID, timestamp, and field unit ID</text>
          <text x="12" y="64" fill="#F59E0B" font-size="9">Rejects empty resolution requests with HTTP 422</text>
        </g>
        
        <g transform="translate(16, 118)">
          <rect width="730" height="68" rx="4" fill="#130826" stroke="#2B1050" stroke-width="1" />
          <text x="12" y="20" fill="#FFFFFF" font-size="10" font-weight="700">Cryptographic Audit Chain &amp; Section 65B Evidence Certificate</text>
          <text x="12" y="36" fill="#C4B5FD" font-size="9">• Every FSM transition generates a cryptographic audit log with request SHA-256 hash and operator IP</text>
          <text x="12" y="52" fill="#C4B5FD" font-size="9">• Closing an incident locks all sightings into an immutable forensic dossier PDF compliant with Indian Evidence Act</text>
        </g>
      </g>
    </g>
</svg>