      <text x="20" y="68" fill="{CYAN}" font-size="10" font-weight="700">Async SQLAlchemy Session Pooling • Pydantic v2 Schema Validation • OpenAPI 3.1 Interactive Docs</text>
    </g>
    
    <!-- 8 Router Clusters Grid -->
    
