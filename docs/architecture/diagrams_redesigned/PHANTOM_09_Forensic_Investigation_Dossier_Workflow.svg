<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0522" />
      <stop offset="50%" stop-color="#14092E" />
      <stop offset="100%" stop-color="#080316" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#100624" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="860" height="820" fill="url(#bgGrad)" rx="8" />
  
  <!-- Precision Technical Grid -->
  <g opacity="0.03" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="820" /><line x1="40" y1="0" x2="40" y2="820" /><line x1="80" y1="0" x2="80" y2="820" /><line x1="120" y1="0" x2="120" y2="820" /><line x1="160" y1="0" x2="160" y2="820" /><line x1="200" y1="0" x2="200" y2="820" /><line x1="240" y1="0" x2="240" y2="820" /><line x1="280" y1="0" x2="280" y2="820" /><line x1="320" y1="0" x2="320" y2="820" /><line x1="360" y1="0" x2="360" y2="820" /><line x1="400" y1="0" x2="400" y2="820" /><line x1="440" y1="0" x2="440" y2="820" /><line x1="480" y1="0" x2="480" y2="820" /><line x1="520" y1="0" x2="520" y2="820" /><line x1="560" y1="0" x2="560" y2="820" /><line x1="600" y1="0" x2="600" y2="820" /><line x1="640" y1="0" x2="640" y2="820" /><line x1="680" y1="0" x2="680" y2="820" /><line x1="720" y1="0" x2="720" y2="820" /><line x1="760" y1="0" x2="760" y2="820" /><line x1="800" y1="0" x2="800" y2="820" /><line x1="840" y1="0" x2="840" y2="820" />
    <line x1="0" y1="0" x2="860" y2="0" /><line x1="0" y1="40" x2="860" y2="40" /><line x1="0" y1="80" x2="860" y2="80" /><line x1="0" y1="120" x2="860" y2="120" /><line x1="0" y1="160" x2="860" y2="160" /><line x1="0" y1="200" x2="860" y2="200" /><line x1="0" y1="240" x2="860" y2="240" /><line x1="0" y1="280" x2="860" y2="280" /><line x1="0" y1="320" x2="860" y2="320" /><line x1="0" y1="360" x2="860" y2="360" /><line x1="0" y1="400" x2="860" y2="400" /><line x1="0" y1="440" x2="860" y2="440" /><line x1="0" y1="480" x2="860" y2="480" /><line x1="0" y1="520" x2="860" y2="520" /><line x1="0" y1="560" x2="860" y2="560" /><line x1="0" y1="600" x2="860" y2="600" /><line x1="0" y1="640" x2="860" y2="640" /><line x1="0" y1="680" x2="860" y2="680" /><line x1="0" y1="720" x2="860" y2="720" /><line x1="0" y1="760" x2="860" y2="760" /><line x1="0" y1="800" x2="860" y2="800" />
  </g>
  <rect width="860" height="820" fill="none" stroke="#6D28D9" stroke-width="1.5" rx="8" />
  
  <!-- Diagram Content -->
  
    <!-- Step 1: Investigation Query Input -->
    <g transform="translate(30, 20)" filter="url(#shadow)">
      <rect width="800" height="110" rx="8" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.8" />
      <rect x="0" y="0" width="800" height="30" rx="8" fill="#130B2E" />
      <text x="20" y="20" fill="#06B6D4" font-size="12" font-weight="800">1. MULTI-MODAL INVESTIGATION QUERY DISPATCH</text>
      
      <g transform="translate(20, 42)">
        <rect width="365" height="56" rx="4" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="14" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">QUERY PATH A: DIRECT LICENSE PLATE</text>
        <text x="14" y="40" fill="#10B981" font-family="monospace" font-size="10">GET /api/v1/investigations/search?plate=GJ01AB1234</text>
      </g>
      
      <g transform="translate(415, 42)">
        <rect width="365" height="56" rx="4" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="14" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">QUERY PATH B: MAKE / MODEL / COLOR HEURISTIC</text>
        <text x="14" y="40" fill="#C084FC" font-family="monospace" font-size="10">search?vehicle_make=Swift&amp;color=Red&amp;district=Ahmedabad</text>
      </g>
    </g>
    
    <path d="M 430 130 L 430 155" stroke="#9333EA" stroke-width="2.5" marker-end="url(#arr)" />
    
    <!-- Step 2: Sighting Graph Retrieval -->
    <g transform="translate(30, 155)" filter="url(#shadow)">
      <rect width="800" height="130" rx="8" fill="url(#cardGrad)" stroke="#9333EA" stroke-width="1.8" />
      <rect x="0" y="0" width="800" height="30" rx="8" fill="#1D0E42" />
      <text x="20" y="20" fill="#FFFFFF" font-size="12" font-weight="800">2. TEMPORAL SIGHTING GRAPH &amp; EVIDENCE RETRIEVAL</text>
      
      <!-- 3 Sightings Visual -->
      <g transform="translate(20, 42)">
        <rect width="240" height="75" rx="4" fill="#0C041C" stroke="#06B6D4" stroke-width="1" />
        <text x="12" y="20" fill="#06B6D4" font-size="10" font-weight="700">SIGHTING 1 // 14:02:11</text>
        <text x="12" y="36" fill="#FFFFFF" font-size="9">SG Highway Junction (Cam #01)</text>
        <text x="12" y="52" fill="#C4B5FD" font-size="8.5">Plate Crop: crop_01_sg.jpg</text>
        <text x="12" y="66" fill="#10B981" font-size="8.5">Plate Confidence: 94.2%</text>
      </g>
      
      <g transform="translate(280, 42)">
        <rect width="240" height="75" rx="4" fill="#0C041C" stroke="#06B6D4" stroke-width="1" />
        <text x="12" y="20" fill="#06B6D4" font-size="10" font-weight="700">SIGHTING 2 // 14:07:45</text>
        <text x="12" y="36" fill="#FFFFFF" font-size="9">Sanand Crossroad (Cam #04)</text>
        <text x="12" y="52" fill="#C4B5FD" font-size="8.5">Plate Crop: crop_04_sanand.jpg</text>
        <text x="12" y="66" fill="#10B981" font-size="8.5">Plate Confidence: 91.8%</text>
      </g>
      
      <g transform="translate(540, 42)">
        <rect width="240" height="75" rx="4" fill="#0C041C" stroke="#06B6D4" stroke-width="1" />
        <text x="12" y="20" fill="#06B6D4" font-size="10" font-weight="700">SIGHTING 3 // 14:14:30</text>
        <text x="12" y="36" fill="#FFFFFF" font-size="9">Bavla Toll Plaza (Cam #09)</text>
        <text x="12" y="52" fill="#C4B5FD" font-size="8.5">Plate Crop: crop_09_bavla.jpg</text>
        <text x="12" y="66" fill="#EF4444" font-size="8.5">BURST Stream Captured</text>
      </g>
    </g>
    
    <path d="M 430 285 L 430 310" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr-green)" />
    
    <!-- Step 3: SHA-256 Cryptographic Verification -->
    <g transform="translate(30, 310)" filter="url(#shadow)">
      <rect width="800" height="155" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" />
      <rect x="0" y="0" width="800" height="30" rx="8" fill="#0E2E18" />
      <text x="20" y="20" fill="#10B981" font-size="12" font-weight="800">3. CRYPTOGRAPHIC SHA-256 EVIDENCE CHAIN-OF-CUSTODY VERIFICATION</text>
      
      <g transform="translate(20, 42)">
        <rect width="365" height="98" rx="4" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="14" y="20" fill="#FFFFFF" font-size="10" font-weight="700">Endpoint: POST /api/v1/investigations/verify</text>
        <text x="14" y="38" fill="#C4B5FD" font-size="9">• Re-computes SHA-256 digest of stored crop</text>
        <text x="14" y="54" fill="#C4B5FD" font-size="9">• Compares against immutable alert hash</text>
        <text x="14" y="70" fill="#FFFFFF" font-family="monospace" font-size="8.5">stored_hash == hashlib.sha256(raw_bytes)</text>
        <text x="14" y="88" fill="#10B981" font-size="9" font-weight="700">VALID: Zero bit-rot or tampering</text>
      </g>
      
      <g transform="translate(415, 42)">
        <rect width="365" height="98" rx="4" fill="#0C041C" stroke="#10B981" stroke-width="1" />
        <text x="14" y="20" fill="#10B981" font-size="10" font-weight="700">Digital Watermark Stamp Applied</text>
        <text x="14" y="38" fill="#C4B5FD" font-size="9">• Hardware GPS Coordinates embedded</text>
        <text x="14" y="54" fill="#C4B5FD" font-size="9">• NTP Microsecond Hardware Timestamp</text>
        <text x="14" y="70" fill="#C4B5FD" font-size="9">• Camera Hardware Serial Hash</text>
        <text x="14" y="88" fill="#06B6D4" font-size="9" font-weight="700">Meets Section 65B Admissibility Rules</text>
      </g>
    </g>
    
    <path d="M 430 465 L 430 490" stroke="#9333EA" stroke-width="2.5" marker-end="url(#arr)" />
    
    <!-- Step 4: Certified Forensic Dossier PDF Generation -->
    <g transform="translate(30, 490)" filter="url(#shadow)">
      <rect width="800" height="270" rx="8" fill="url(#cardGrad)" stroke="#9333EA" stroke-width="2" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#1C0E42" />
      <text x="20" y="23" fill="#FFFFFF" font-size="13" font-weight="800">4. CERTIFIED SECTION 65B COURT-ADMISSIBLE FORENSIC DOSSIER PDF</text>
      
      <!-- Dossier Document Graphic Mockup -->
      <g transform="translate(30, 50)">
        <rect width="200" height="200" rx="4" fill="#0C041C" stroke="#FFFFFF" stroke-width="1.5" />
        
        <!-- Header of PDF -->
        <rect x="10" y="10" width="180" height="24" rx="2" fill="#24104D" />
        <text x="100" y="26" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">GUJARAT POLICE NETRAM C2</text>
        
        <!-- Red Seal -->
        <circle cx="165" cy="55" r="14" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.5" />
        <text x="165" y="58" fill="#EF4444" font-size="6" font-weight="800" text-anchor="middle">SEC 65B</text>
        
        <text x="16" y="50" fill="#06B6D4" font-size="8" font-weight="700">CASE DOSSIER #GJ-2026-881</text>
        <text x="16" y="62" fill="#C4B5FD" font-size="7">Target: GJ01AB1234 (Swift)</text>
        
        <!-- Timeline snippet in mockup -->
        <line x1="16" y1="72" x2="184" y2="72" stroke="#6D28D9" stroke-width="1" />
        <text x="16" y="84" fill="#FFFFFF" font-size="7">• 14:02:11 SG Highway (Cam #01)</text>
        <text x="16" y="96" fill="#FFFFFF" font-size="7">• 14:07:45 Sanand Rd (Cam #04)</text>
        <text x="16" y="108" fill="#FFFFFF" font-size="7">• 14:14:30 Bavla Toll (Cam #09)</text>
        
        <!-- Evidence Hashes snippet -->
        <line x1="16" y1="116" x2="184" y2="116" stroke="#6D28D9" stroke-width="1" />
        <text x="16" y="128" fill="#10B981" font-size="6.5">SHA-256: 9e107d9d372bb6826bd81e35...</text>
        <text x="16" y="138" fill="#10B981" font-size="6.5">SHA-256: 4b227777d4dd1fc61c6f884f...</text>
        
        <!-- Officer Signature -->
        <rect x="16" y="150" width="168" height="38" rx="2" fill="#140828" stroke="#3D1870" stroke-width="1" />
        <text x="22" y="162" fill="#C4B5FD" font-size="6.5">Digitally Signed By:</text>
        <text x="22" y="172" fill="#FFFFFF" font-size="7" font-weight="700">Inspector R. K. Jadeja, Netram C2</text>
        <text x="22" y="182" fill="#06B6D4" font-size="6">Cert Hash: a891f03d5c... Verified</text>
      </g>
      
      <!-- Dossier Features (Right) -->
      <g transform="translate(250, 50)">
        <rect width="525" height="200" rx="6" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="16" y="24" fill="#FFFFFF" font-size="11" font-weight="700">MANDATORY INDIAN EVIDENCE ACT STATUTORY INCLUSIONS:</text>
        
        <text x="16" y="46" fill="#C4B5FD" font-size="9.5">1. Complete chronological multi-camera trajectory map with GIS coordinates</text>
        <text x="16" y="64" fill="#C4B5FD" font-size="9.5">2. High-resolution raw bounding box crops with uncompressed plate crops</text>
        <text x="16" y="82" fill="#C4B5FD" font-size="9.5">3. Immutable cryptographic SHA-256 hash printed alongside each exhibit</text>
        <text x="16" y="100" fill="#C4B5FD" font-size="9.5">4. Section 65B Electronic Record Certificate signed by authorized officer</text>
        <text x="16" y="118" fill="#C4B5FD" font-size="9.5">5. Hardware device serial number, MAC address, and firmware revision hash</text>
        <text x="16" y="136" fill="#C4B5FD" font-size="9.5">6. Exact UTC &amp; IST synchronized NTP time stamps (microsecond precision)</text>
        
        <rect x="16" y="152" width="493" height="36" rx="4" fill="#16082A" stroke="#10B981" stroke-width="1" />
        <text x="26" y="174" fill="#10B981" font-size="10" font-weight="700">Generated instantaneously via ReportLab PDF engine: &lt; 850ms per dossier</text>
      </g>
    </g>
</svg>