<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0522" />
      <stop offset="50%" stop-color="#14092E" />
      <stop offset="100%" stop-color="#080316" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#100624" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="860" height="820" fill="url(#bgGrad)" rx="8" />
  
  <!-- Precision Technical Grid -->
  <g opacity="0.03" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="820" /><line x1="40" y1="0" x2="40" y2="820" /><line x1="80" y1="0" x2="80" y2="820" /><line x1="120" y1="0" x2="120" y2="820" /><line x1="160" y1="0" x2="160" y2="820" /><line x1="200" y1="0" x2="200" y2="820" /><line x1="240" y1="0" x2="240" y2="820" /><line x1="280" y1="0" x2="280" y2="820" /><line x1="320" y1="0" x2="320" y2="820" /><line x1="360" y1="0" x2="360" y2="820" /><line x1="400" y1="0" x2="400" y2="820" /><line x1="440" y1="0" x2="440" y2="820" /><line x1="480" y1="0" x2="480" y2="820" /><line x1="520" y1="0" x2="520" y2="820" /><line x1="560" y1="0" x2="560" y2="820" /><line x1="600" y1="0" x2="600" y2="820" /><line x1="640" y1="0" x2="640" y2="820" /><line x1="680" y1="0" x2="680" y2="820" /><line x1="720" y1="0" x2="720" y2="820" /><line x1="760" y1="0" x2="760" y2="820" /><line x1="800" y1="0" x2="800" y2="820" /><line x1="840" y1="0" x2="840" y2="820" />
    <line x1="0" y1="0" x2="860" y2="0" /><line x1="0" y1="40" x2="860" y2="40" /><line x1="0" y1="80" x2="860" y2="80" /><line x1="0" y1="120" x2="860" y2="120" /><line x1="0" y1="160" x2="860" y2="160" /><line x1="0" y1="200" x2="860" y2="200" /><line x1="0" y1="240" x2="860" y2="240" /><line x1="0" y1="280" x2="860" y2="280" /><line x1="0" y1="320" x2="860" y2="320" /><line x1="0" y1="360" x2="860" y2="360" /><line x1="0" y1="400" x2="860" y2="400" /><line x1="0" y1="440" x2="860" y2="440" /><line x1="0" y1="480" x2="860" y2="480" /><line x1="0" y1="520" x2="860" y2="520" /><line x1="0" y1="560" x2="860" y2="560" /><line x1="0" y1="600" x2="860" y2="600" /><line x1="0" y1="640" x2="860" y2="640" /><line x1="0" y1="680" x2="860" y2="680" /><line x1="0" y1="720" x2="860" y2="720" /><line x1="0" y1="760" x2="860" y2="760" /><line x1="0" y1="800" x2="860" y2="800" />
  </g>
  <rect width="860" height="820" fill="none" stroke="#6D28D9" stroke-width="1.5" rx="8" />
  
  <!-- Diagram Content -->
  
    <!-- Row 1: Sentinel Ingestion Discovery -->
    <g transform="translate(30, 20)" filter="url(#shadow)">
      <rect width="800" height="145" rx="8" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.8" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#14082E" />
      <text x="20" y="23" fill="#06B6D4" font-size="13" font-weight="800">1. DYNAMIC SENTINEL CATALOGUE INGESTION (/api/ingest)</text>
      
      <g transform="translate(20, 46)">
        <rect width="365" height="85" rx="6" fill="#0C041C" stroke="#6D28D9" stroke-width="1" />
        <text x="16" y="22" fill="#FFFFFF" font-size="11" font-weight="700">Corp8SourceAdapter Dynamic Sync</text>
        <text x="16" y="40" fill="#C4B5FD" font-size="9.5">• Zero hard-coded cameras; polls external registry</text>
        <text x="16" y="56" fill="#C4B5FD" font-size="9.5">• Reconciles camera state: Active, Inactive, Maintenance</text>
        <text x="16" y="72" fill="#10B981" font-size="9.5" font-weight="700">Sync cycle: Every 60s background async loop</text>
      </g>
      
      <g transform="translate(415, 46)">
        <rect width="365" height="85" rx="6" fill="#0C041C" stroke="#F59E0B" stroke-width="1" />
        <text x="16" y="22" fill="#F59E0B" font-size="11" font-weight="700">5-Stage Exponential Backoff on Failure</text>
        <text x="16" y="40" fill="#FFFFFF" font-size="9.5">On HTTP 502 / Connection Timeout:</text>
        <text x="16" y="56" fill="#FFFFFF" font-size="10.5" font-family="monospace">2s -> 4s -> 8s -> 16s -> 30s (Max)</text>
        <text x="16" y="72" fill="#C4B5FD" font-size="9.5">Enters DEGRADED state; preserves cached GIS data</text>
      </g>
    </g>
    
    <path d="M 430 165 L 430 195" stroke="#9333EA" stroke-width="2.5" marker-end="url(#arr)" />
    
    <!-- Row 2: Camera State Machine Lifecycle -->
    <g transform="translate(30, 195)" filter="url(#shadow)">
      <rect width="800" height="155" rx="8" fill="url(#cardGrad)" stroke="#9333EA" stroke-width="1.8" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#1A0D3D" />
      <text x="20" y="23" fill="#FFFFFF" font-size="13" font-weight="800">2. CAMERA STREAMING STATE MACHINE &amp; PROTOCOL RESOLUTION</text>
      
      <!-- FSM Nodes -->
      <g transform="translate(25, 52)">
        <rect width="125" height="85" rx="6" fill="#0C041C" stroke="#C4B5FD" stroke-width="1.5" />
        <text x="62" y="26" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">DISCOVERED</text>
        <text x="62" y="44" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Found in /api/ingest</text>
        <text x="62" y="60" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Validating RTSP URI</text>
      </g>
      
      <path d="M 150 94 L 180 94" stroke="#C084FC" stroke-width="2" marker-end="url(#arr)" />
      
      <g transform="translate(180, 52)">
        <rect width="125" height="85" rx="6" fill="#0C041C" stroke="#06B6D4" stroke-width="1.5" />
        <text x="62" y="26" fill="#06B6D4" font-size="11" font-weight="700" text-anchor="middle">PROBING</text>
        <text x="62" y="44" fill="#C4B5FD" font-size="8.5" text-anchor="middle">RTSP over TCP test</text>
        <text x="62" y="60" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Hardware PTS check</text>
      </g>
      
      <path d="M 305 94 L 335 94" stroke="#10B981" stroke-width="2" marker-end="url(#arr-green)" />
      
      <g transform="translate(335, 52)">
        <rect width="145" height="85" rx="6" fill="#0C041C" stroke="#10B981" stroke-width="2" />
        <circle cx="20" cy="20" r="5" fill="#10B981" filter="url(#subtleGlow)" />
        <text x="80" y="24" fill="#10B981" font-size="11" font-weight="800" text-anchor="middle">ACTIVE_STREAM</text>
        <text x="72" y="44" fill="#FFFFFF" font-size="8.5" text-anchor="middle">1-Slot Ring Buffer Open</text>
        <text x="72" y="58" fill="#C4B5FD" font-size="8.5" text-anchor="middle">YOLO26 Inference Running</text>
        <text x="72" y="72" fill="#06B6D4" font-size="8.5" text-anchor="middle">WHEP Browser Preview</text>
      </g>
      
      <path d="M 480 94 L 510 94" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-red)" />
      
      <g transform="translate(510, 52)">
        <rect width="125" height="85" rx="6" fill="#0C041C" stroke="#EF4444" stroke-width="1.5" />
        <text x="62" y="26" fill="#EF4444" font-size="11" font-weight="700" text-anchor="middle">OFFLINE</text>
        <text x="62" y="44" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Timeout &gt; 5.0s</text>
        <text x="62" y="60" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Packet loss detected</text>
      </g>
      
      <path d="M 635 94 L 665 94" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr)" />
      
      <g transform="translate(665, 52)">
        <rect width="115" height="85" rx="6" fill="#0C041C" stroke="#F59E0B" stroke-width="1.5" />
        <text x="57" y="26" fill="#F59E0B" font-size="11" font-weight="700" text-anchor="middle">RETRYING</text>
        <text x="57" y="44" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Exponential backoff</text>
        <text x="57" y="60" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Max 30s interval</text>
      </g>
    </g>
    
    <path d="M 430 350 L 430 380" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr-green)" />
    
    <!-- Row 3: Dynamic Load Pacing Profiles (4 Profiles) -->
    <g transform="translate(30, 380)" filter="url(#shadow)">
      <rect width="800" height="380" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.8" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#0F2B1C" />
      <text x="20" y="23" fill="#10B981" font-size="13" font-weight="800">3. ADAPTIVE LOAD PACING &amp; BANDWIDTH ALLOCATION PROFILES</text>
      
      <!-- 4 Profile Cards -->
      <!-- Profile 1: LOW -->
      <g transform="translate(20, 50)">
        <rect width="175" height="310" rx="6" fill="#0C041C" stroke="#C4B5FD" stroke-width="1.5" />
        <rect x="0" y="0" width="175" height="36" rx="6" fill="#140828" />
        <text x="87" y="24" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">PROFILE: LOW</text>
        
        <text x="16" y="60" fill="#C4B5FD" font-size="10.5" font-weight="700">Bitrate: 500 kbps</text>
        <text x="16" y="78" fill="#C4B5FD" font-size="10.5" font-weight="700">Framerate: 5 FPS</text>
        <text x="16" y="96" fill="#C4B5FD" font-size="10.5" font-weight="700">Resolution: 720p</text>
        
        <rect x="12" y="115" width="151" height="180" rx="4" fill="#070314" stroke="#25104A" stroke-width="1" />
        <text x="20" y="135" fill="#FFFFFF" font-size="10" font-weight="700">OPERATIONAL USE:</text>
        <text x="20" y="155" fill="#C4B5FD" font-size="9">• Rural highway stretches</text>
        <text x="20" y="172" fill="#C4B5FD" font-size="9">• Low-activity perimeters</text>
        <text x="20" y="189" fill="#C4B5FD" font-size="9">• Zero watchlist presence</text>
        <text x="20" y="215" fill="#06B6D4" font-size="9.5" font-weight="700">COMPUTE SAVINGS:</text>
        <text x="20" y="232" fill="#10B981" font-size="9.5">83% GPU cycle reduction</text>
        <text x="20" y="250" fill="#C4B5FD" font-size="8.5">Background polling only</text>
      </g>
      
      <!-- Profile 2: MEDIUM -->
      <g transform="translate(210, 50)">
        <rect width="175" height="310" rx="6" fill="#0C041C" stroke="#06B6D4" stroke-width="1.5" />
        <rect x="0" y="0" width="175" height="36" rx="6" fill="#0C2030" />
        <text x="87" y="24" fill="#06B6D4" font-size="12" font-weight="800" text-anchor="middle">PROFILE: MEDIUM</text>
        
        <text x="16" y="60" fill="#06B6D4" font-size="10.5" font-weight="700">Bitrate: 1500 kbps</text>
        <text x="16" y="78" fill="#06B6D4" font-size="10.5" font-weight="700">Framerate: 15 FPS</text>
        <text x="16" y="96" fill="#06B6D4" font-size="10.5" font-weight="700">Resolution: 1080p</text>
        
        <rect x="12" y="115" width="151" height="180" rx="4" fill="#070314" stroke="#103040" stroke-width="1" />
        <text x="20" y="135" fill="#FFFFFF" font-size="10" font-weight="700">OPERATIONAL USE:</text>
        <text x="20" y="155" fill="#C4B5FD" font-size="9">• Standard municipal grid</text>
        <text x="20" y="172" fill="#C4B5FD" font-size="9">• Moderate urban traffic</text>
        <text x="20" y="189" fill="#C4B5FD" font-size="9">• Baseline ANPR active</text>
        <text x="20" y="215" fill="#06B6D4" font-size="9.5" font-weight="700">DEFAULT STATE:</text>
        <text x="20" y="232" fill="#FFFFFF" font-size="9.5">48 streams per L40S</text>
        <text x="20" y="250" fill="#C4B5FD" font-size="8.5">Nominal state-wide profile</text>
      </g>
      
      <!-- Profile 3: HIGH -->
      <g transform="translate(400, 50)">
        <rect width="175" height="310" rx="6" fill="#0C041C" stroke="#9333EA" stroke-width="1.5" />
        <rect x="0" y="0" width="175" height="36" rx="6" fill="#240D4A" />
        <text x="87" y="24" fill="#C084FC" font-size="12" font-weight="800" text-anchor="middle">PROFILE: HIGH</text>
        
        <text x="16" y="60" fill="#C084FC" font-size="10.5" font-weight="700">Bitrate: 2500 kbps</text>
        <text x="16" y="78" fill="#C084FC" font-size="10.5" font-weight="700">Framerate: 25 FPS</text>
        <text x="16" y="96" fill="#C084FC" font-size="10.5" font-weight="700">Resolution: 1080p</text>
        
        <rect x="12" y="115" width="151" height="180" rx="4" fill="#070314" stroke="#35105A" stroke-width="1" />
        <text x="20" y="135" fill="#FFFFFF" font-size="10" font-weight="700">OPERATIONAL USE:</text>
        <text x="20" y="155" fill="#C4B5FD" font-size="9">• Major highway tolls</text>
        <text x="20" y="172" fill="#C4B5FD" font-size="9">• Dense city junctions</text>
        <text x="20" y="189" fill="#C4B5FD" font-size="9">• Active manual viewing</text>
        <text x="20" y="215" fill="#06B6D4" font-size="9.5" font-weight="700">HIGH PRECISION:</text>
        <text x="20" y="232" fill="#FFFFFF" font-size="9.5">Full ANPR + 2W/Car</text>
        <text x="20" y="250" fill="#C4B5FD" font-size="8.5">Fast-moving traffic</text>
      </g>
      
      <!-- Profile 4: BURST_TRACKING -->
      <g transform="translate(590, 50)">
        <rect width="190" height="310" rx="6" fill="#0C041C" stroke="#EF4444" stroke-width="2" />
        <rect x="0" y="0" width="190" height="36" rx="6" fill="#3D0B1C" />
        <circle cx="16" cy="18" r="4" fill="#EF4444" filter="url(#subtleGlow)" />
        <text x="100" y="24" fill="#EF4444" font-size="11.5" font-weight="800" text-anchor="middle">BURST_TRACKING</text>
        
        <text x="16" y="60" fill="#EF4444" font-size="10.5" font-weight="700">Bitrate: 4000 kbps</text>
        <text x="16" y="78" fill="#EF4444" font-size="10.5" font-weight="700">Framerate: 30 FPS</text>
        <text x="16" y="96" fill="#EF4444" font-size="10.5" font-weight="700">Resolution: 1080p HQ</text>
        
        <rect x="12" y="115" width="166" height="180" rx="4" fill="#070314" stroke="#501020" stroke-width="1" />
        <text x="18" y="135" fill="#FFFFFF" font-size="10" font-weight="700">TRIGGER CONDITIONS:</text>
        <text x="18" y="155" fill="#FFFFFF" font-size="9">• Watchlist match hit</text>
        <text x="18" y="172" fill="#FFFFFF" font-size="9">• Suspect vehicle pursuit</text>
        <text x="18" y="189" fill="#FFFFFF" font-size="9">• VIP escort corridor</text>
        <text x="18" y="215" fill="#F59E0B" font-size="9.5" font-weight="700">AUTO-DEESCALATION:</text>
        <text x="18" y="232" fill="#C4B5FD" font-size="9">Reverts to MEDIUM after</text>
        <text x="18" y="250" fill="#C4B5FD" font-size="9">120s of no target sighting</text>
      </g>
    </g>
</svg>