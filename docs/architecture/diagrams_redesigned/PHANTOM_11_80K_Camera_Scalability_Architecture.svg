        <text x="14" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Command HUD &amp; Dispatch</text>
        <text x="14" y="40" fill="#C4B5FD" font-size="9">• State-wide executive wall</text>
        <text x="14" y="56" fill="#C4B5FD" font-size="9">• WebSocket alert multiplexer</text>
        <text x="14" y="72" fill="#C4B5FD" font-size="9">• Cross-district PCR dispatch</text>
        <text x="14" y="88" fill="#C4B5FD" font-size="9">• Incident FSM master sync</text>
