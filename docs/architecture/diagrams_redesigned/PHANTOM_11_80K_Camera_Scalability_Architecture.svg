        <text x="14" y="40" fill="#C4B5FD" font-size="9">• Vadodara, Rajkot, Bhavnagar...</text>
        <text x="14" y="56" fill="#C4B5FD" font-size="9">• 772x GPUs distributed</text>
        <text x="14" y="72" fill="#C4B5FD" font-size="9">• Autonomous air-gapped run</text>
        <text x="14" y="90" fill="#10B981" font-size="9">Survives central WAN severed</text>
        <text x="14" y="106" fill="#06B6D4" font-size="8.5">Local Redis buffer (10K alerts)</text>
      </g>
    </g>
    
    <!-- Connector Arrow -->
    <path d="M 430 350 L 430 380" stroke="#10B981" stroke-width="3" marker-end="url(#arr-green)" />
    <rect x="340" y="357" width="180" height="20" rx="4" fill="#0C041C" stroke="#10B981" stroke-width="1" />
    <text x="430" y="371" fill="#10B981" font-size="9" font-weight="800" text-anchor="middle">METADATA ONLY: 153.6 Mbps</text>
    
    <!-- Tier 2: Regional Hubs / Zone Gateways -->
