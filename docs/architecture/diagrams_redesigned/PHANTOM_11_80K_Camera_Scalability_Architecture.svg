        <text x="14" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">State AI Copilot &amp; BI</text>
        <text x="14" y="40" fill="#C4B5FD" font-size="9">• SurveillanceCopilot Agent</text>
        <text x="14" y="56" fill="#C4B5FD" font-size="9">• 40+ Grounded tools active</text>
        <text x="14" y="72" fill="#C4B5FD" font-size="9">• Multilingual NLP (EN, HI, GU)</text>
        <text x="14" y="88" fill="#C4B5FD" font-size="9">• Cross-district trajectory solver</text>
