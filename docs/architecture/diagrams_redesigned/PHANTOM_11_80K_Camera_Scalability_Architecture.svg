        <text x="90" y="38" fill="#FFFFFF" font-size="24" font-weight="900" text-anchor="middle">80,000</text>
        <text x="90" y="56" fill="#06B6D4" font-size="10" font-weight="800" text-anchor="middle">CCTV CAMERAS</text>
        <text x="90" y="70" fill="#C4B5FD" font-size="8.5" text-anchor="middle">Across 33 Gujarat Districts</text>
      </g>
      
