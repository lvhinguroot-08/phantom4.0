      <rect width="800" height="140" rx="8" fill="url(#cardGrad)" stroke="#C084FC" stroke-width="1.8" />
      <rect x="0" y="0" width="800" height="30" rx="8" fill="#1C0E42" />
      <text x="20" y="20" fill="#C084FC" font-size="12" font-weight="800">TIER 2: REGIONAL ZONE GATEWAYS (APACHE KAFKA &amp; REDIS CLUSTERS)</text>
      
      <g transform="translate(20, 42)">
        <rect width="365" height="85" rx="6" fill="#080316" stroke="#6D28D9" stroke-width="1" />
        <text x="14" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">North &amp; Central Zone Gateway (Ahmedabad)</text>
        <text x="14" y="40" fill="#C4B5FD" font-size="9">• 5-Broker Apache Kafka Cluster (cctv.events topic)</text>
        <text x="14" y="56" fill="#C4B5FD" font-size="9">• Redis Sentinel hot cache for cross-district plate match</text>
        <text x="14" y="72" fill="#06B6D4" font-size="9">Aggregates 45,000 camera event streams</text>
      </g>
      
      <g transform="translate(415, 42)">
        <rect width="365" height="85" rx="6" fill="#080316" stroke="#6D28D9" stroke-width="1" />
        <text x="14" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">South &amp; Saurashtra Zone Gateway (Surat)</text>
        <text x="14" y="40" fill="#C4B5FD" font-size="9">• 5-Broker Apache Kafka Cluster (cctv.events topic)</text>
        <text x="14" y="56" fill="#C4B5FD" font-size="9">• Redis Sentinel hot cache for coastal &amp; highway alert bus</text>
        <text x="14" y="72" fill="#06B6D4" font-size="9">Aggregates 35,000 camera event streams</text>
      </g>
    </g>
    
    <!-- Connector Arrow -->
    <path d="M 430 525 L 430 555" stroke="#9333EA" stroke-width="3" marker-end="url(#arr)" />
    
    <!-- Tier 3: Central State Police Headquarters / Netram State CCC -->
    <g transform="translate(30, 555)" filter="url(#shadow)">
      <rect width="800" height="215" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" />
      <rect x="0" y="0" width="800" height="34" rx="8" fill="#2E1805" />
      <text x="20" y="23" fill="#F59E0B" font-size="13" font-weight="800">TIER 3: CENTRAL STATE COMMAND &amp; CONTROL CENTER (GANDHINAGAR CCC)</text>
      
      <g transform="translate(20, 48)">
        <rect width="240" height="150" rx="6" fill="#080316" stroke="#6D28D9" stroke-width="1" />
        <text x="14" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Master Database Grid</text>
        <text x="14" y="40" fill="#C4B5FD" font-size="9">• PostgreSQL 16 + PostGIS</text>
        <text x="14" y="56" fill="#C4B5FD" font-size="9">• Patroni HA (3-Node cluster)</text>
        <text x="14" y="72" fill="#C4B5FD" font-size="9">• Temporal table partitioning</text>
