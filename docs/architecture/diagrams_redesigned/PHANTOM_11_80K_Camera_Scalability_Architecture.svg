        <text x="90" y="56" fill="#10B981" font-size="10" font-weight="800" text-anchor="middle">BANDWIDTH REDUCTION</text>
        <text x="90" y="70" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle">WAN load drops to 154 Mbps</text>
