<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0522" />
      <stop offset="50%" stop-color="#14092E" />
      <stop offset="100%" stop-color="#080316" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0D3B" />
      <stop offset="100%" stop-color="#100624" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="860" height="820" fill="url(#bgGrad)" rx="8" />
  
  <!-- Precision Technical Grid -->
  <g opacity="0.03" stroke="#A855F7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="820" /><line x1="40" y1="0" x2="40" y2="820" /><line x1="80" y1="0" x2="80" y2="820" /><line x1="120" y1="0" x2="120" y2="820" /><line x1="160" y1="0" x2="160" y2="820" /><line x1="200" y1="0" x2="200" y2="820" /><line x1="240" y1="0" x2="240" y2="820" /><line x1="280" y1="0" x2="280" y2="820" /><line x1="320" y1="0" x2="320" y2="820" /><line x1="360" y1="0" x2="360" y2="820" /><line x1="400" y1="0" x2="400" y2="820" /><line x1="440" y1="0" x2="440" y2="820" /><line x1="480" y1="0" x2="480" y2="820" /><line x1="520" y1="0" x2="520" y2="820" /><line x1="560" y1="0" x2="560" y2="820" /><line x1="600" y1="0" x2="600" y2="820" /><line x1="640" y1="0" x2="640" y2="820" /><line x1="680" y1="0" x2="680" y2="820" /><line x1="720" y1="0" x2="720" y2="820" /><line x1="760" y1="0" x2="760" y2="820" /><line x1="800" y1="0" x2="800" y2="820" /><line x1="840" y1="0" x2="840" y2="820" />
    <line x1="0" y1="0" x2="860" y2="0" /><line x1="0" y1="40" x2="860" y2="40" /><line x1="0" y1="80" x2="860" y2="80" /><line x1="0" y1="120" x2="860" y2="120" /><line x1="0" y1="160" x2="860" y2="160" /><line x1="0" y1="200" x2="860" y2="200" /><line x1="0" y1="240" x2="860" y2="240" /><line x1="0" y1="280" x2="860" y2="280" /><line x1="0" y1="320" x2="860" y2="320" /><line x1="0" y1="360" x2="860" y2="360" /><line x1="0" y1="400" x2="860" y2="400" /><line x1="0" y1="440" x2="860" y2="440" /><line x1="0" y1="480" x2="860" y2="480" /><line x1="0" y1="520" x2="860" y2="520" /><line x1="0" y1="560" x2="860" y2="560" /><line x1="0" y1="600" x2="860" y2="600" /><line x1="0" y1="640" x2="860" y2="640" /><line x1="0" y1="680" x2="860" y2="680" /><line x1="0" y1="720" x2="860" y2="720" /><line x1="0" y1="760" x2="860" y2="760" /><line x1="0" y1="800" x2="860" y2="800" />
  </g>
  <rect width="860" height="820" fill="none" stroke="#6D28D9" stroke-width="1.5" rx="8" />
  
  <!-- Diagram Content -->
  
    <!-- Root Frame Input -->
    <g transform="translate(230, 20)" filter="url(#shadow)">
      <rect width="400" height="52" rx="8" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="2" />
      <text x="200" y="26" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">RAW CCTV VIDEO FRAME / RTSP FEED</text>
      <text x="200" y="42" fill="#06B6D4" font-size="10.5" font-weight="600" text-anchor="middle">H.264 / H.265 Decode @ 1080p Resolution</text>
    </g>
    
    <path d="M 430 72 L 430 105" stroke="#C084FC" stroke-width="2.5" marker-end="url(#arr)" />
    
    <!-- Shared YOLO26 Backbone -->
    <g transform="translate(180, 105)" filter="url(#shadow)">
      <rect width="500" height="54" rx="8" fill="#1C0E3F" stroke="#9333EA" stroke-width="2" />
      <text x="250" y="28" fill="#FFFFFF" font-size="13.5" font-weight="800" text-anchor="middle">SHARED YOLO26 BACKBONE DETECTOR (FP16 TensorRT)</text>
      <text x="250" y="45" fill="#C4B5FD" font-size="10.5" font-weight="500" text-anchor="middle">Bounding Box Localization + Preliminary Class Logits (Confidence &gt; 0.45)</text>
    </g>
    
    <!-- Branch to Level 1 Categories -->
    <path d="M 430 159 L 430 185" stroke="#C084FC" stroke-width="2" />
    <path d="M 130 185 L 730 185" stroke="#C084FC" stroke-width="2" />
    <path d="M 130 185 L 130 215" stroke="#C084FC" stroke-width="2" marker-end="url(#arr)" />
    <path d="M 330 185 L 330 215" stroke="#C084FC" stroke-width="2" marker-end="url(#arr)" />
    <path d="M 530 185 L 530 215" stroke="#C084FC" stroke-width="2" marker-end="url(#arr)" />
    <path d="M 730 185 L 730 215" stroke="#C084FC" stroke-width="2" marker-end="url(#arr)" />
    
    <!-- Level 1 Category Cards -->
    <!-- Col 1: Person & Pole Filter -->
    <g transform="translate(40, 215)" filter="url(#shadow)">
      <rect width="180" height="50" rx="6" fill="#120826" stroke="#06B6D4" stroke-width="1.5" />
      <text x="90" y="24" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">L1: PERSON</text>
      <text x="90" y="40" fill="#06B6D4" font-size="9.5" text-anchor="middle">Pedestrian Candidate</text>
      
      <path d="M 90 50 L 90 85" stroke="#06B6D4" stroke-width="2" marker-end="url(#arr)" />
      
      <rect y="85" width="180" height="90" rx="6" fill="#1B0E38" stroke="#F59E0B" stroke-width="1.5" />
      <text x="90" y="106" fill="#F59E0B" font-size="10.5" font-weight="700" text-anchor="middle">Hard-Negative Filter</text>
      <text x="90" y="124" fill="#C4B5FD" font-size="9" text-anchor="middle">Aspect Ratio &gt; 3.2</text>
      <text x="90" y="140" fill="#C4B5FD" font-size="9" text-anchor="middle">Optical Flow = 0.0</text>
      <text x="90" y="160" fill="#10B981" font-size="9" font-weight="700" text-anchor="middle">Filters Streetlight Poles</text>
    </g>
    
    <!-- Col 2: Two-Wheeler Classifier -->
    <g transform="translate(240, 215)" filter="url(#shadow)">
      <rect width="180" height="50" rx="6" fill="#120826" stroke="#C084FC" stroke-width="1.5" />
      <text x="90" y="24" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">L1: TWO-WHEELER</text>
      <text x="90" y="40" fill="#C084FC" font-size="9.5" text-anchor="middle">L2: Scooter / Motorcycle</text>
      
      <path d="M 90 50 L 90 85" stroke="#C084FC" stroke-width="2" marker-end="url(#arr)" />
      
      <rect y="85" width="180" height="180" rx="6" fill="#1B0E38" stroke="#C084FC" stroke-width="1.5" />
      <text x="90" y="106" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Specialized 2W Classifier</text>
      <text x="90" y="122" fill="#C4B5FD" font-size="9" text-anchor="middle">Geometry + Chassis Scan</text>
      
      <rect x="10" y="132" width="160" height="55" rx="4" fill="#0C041C" stroke="#10B981" stroke-width="1" />
      <text x="16" y="148" fill="#10B981" font-size="10" font-weight="700">HONDA ACTIVA (Scooter)</text>
      <text x="16" y="162" fill="#C4B5FD" font-size="8.5">Step-through chassis profile</text>
      <text x="16" y="176" fill="#C4B5FD" font-size="8.5">Small 10/12-inch wheels</text>
      
      <rect x="10" y="195" width="160" height="55" rx="4" fill="#0C041C" stroke="#06B6D4" stroke-width="1" />
      <text x="16" y="211" fill="#06B6D4" font-size="10" font-weight="700">HERO SPLENDOR (Bike)</text>
      <text x="16" y="225" fill="#C4B5FD" font-size="8.5">Exposed central fuel tank</text>
      <text x="16" y="239" fill="#C4B5FD" font-size="8.5">18-inch spoked wheels</text>
    </g>
    
    <!-- Col 3: Car Classifier -->
    <g transform="translate(440, 215)" filter="url(#shadow)">
      <rect width="180" height="50" rx="6" fill="#120826" stroke="#10B981" stroke-width="1.5" />
      <text x="90" y="24" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">L1: VEHICLE (CAR)</text>
      <text x="90" y="40" fill="#10B981" font-size="9.5" text-anchor="middle">L2: Hatchback / Sedan / SUV</text>
      
      <path d="M 90 50 L 90 85" stroke="#10B981" stroke-width="2" marker-end="url(#arr)" />
      
      <rect y="85" width="180" height="180" rx="6" fill="#1B0E38" stroke="#10B981" stroke-width="1.5" />
      <text x="90" y="106" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Specialized Car Classifier</text>
      <text x="90" y="122" fill="#C4B5FD" font-size="9" text-anchor="middle">Roofline &amp; Aspect Ratio</text>
      
      <rect x="10" y="132" width="160" height="55" rx="4" fill="#0C041C" stroke="#F59E0B" stroke-width="1" />
      <text x="16" y="148" fill="#F59E0B" font-size="10" font-weight="700">MARUTI WAGON-R</text>
      <text x="16" y="162" fill="#C4B5FD" font-size="8.5">Aspect Ratio &lt; 0.95</text>
      <text x="16" y="176" fill="#C4B5FD" font-size="8.5">Vertical tall-boy roofline</text>
      
      <rect x="10" y="195" width="160" height="55" rx="4" fill="#0C041C" stroke="#06B6D4" stroke-width="1" />
      <text x="16" y="211" fill="#06B6D4" font-size="10" font-weight="700">MARUTI SWIFT</text>
      <text x="16" y="225" fill="#C4B5FD" font-size="8.5">Aspect Ratio &gt; 1.05</text>
      <text x="16" y="239" fill="#C4B5FD" font-size="8.5">Swept aerodynamic curve</text>
    </g>
    
    <!-- Col 4: Auto-Rickshaw -->
    <g transform="translate(640, 215)" filter="url(#shadow)">
      <rect width="180" height="50" rx="6" fill="#120826" stroke="#F59E0B" stroke-width="1.5" />
      <text x="90" y="24" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">L1: THREE-WHEELER</text>
      <text x="90" y="40" fill="#F59E0B" font-size="9.5" text-anchor="middle">L2: Auto-Rickshaw</text>
      
      <path d="M 90 50 L 90 85" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr)" />
      
      <rect y="85" width="180" height="180" rx="6" fill="#1B0E38" stroke="#F59E0B" stroke-width="1.5" />
      <text x="90" y="106" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Auto Disambiguator</text>
      <text x="90" y="122" fill="#C4B5FD" font-size="9" text-anchor="middle">Apron &amp; Cabin Structure</text>
      
      <rect x="10" y="132" width="160" height="118" rx="4" fill="#0C041C" stroke="#10B981" stroke-width="1" />
      <text x="16" y="152" fill="#10B981" font-size="10.5" font-weight="700">BAJAJ COMPACT AUTO</text>
      <text x="16" y="172" fill="#C4B5FD" font-size="9">• Delta 3-wheel geometry</text>
      <text x="16" y="190" fill="#C4B5FD" font-size="9">• Soft canvas canopy roof</text>
      <text x="16" y="208" fill="#C4B5FD" font-size="9">• Open passenger cabin</text>
      <text x="16" y="226" fill="#06B6D4" font-size="8.5">Prevents mini-truck mixup</text>
    </g>
    
    <!-- Convergence to Temporal Track Fusion -->
    <path d="M 130 380 L 130 520 L 330 520 L 330 545" stroke="#9333EA" stroke-width="2" />
    <path d="M 330 485 L 330 545" stroke="#9333EA" stroke-width="2" />
    <path d="M 530 485 L 530 545" stroke="#9333EA" stroke-width="2" />
    <path d="M 730 485 L 730 520 L 530 520 L 530 545" stroke="#9333EA" stroke-width="2" marker-end="url(#arr)" />
    
    <g transform="translate(100, 545)" filter="url(#shadow)">
      <rect width="660" height="110" rx="8" fill="url(#cardGrad)" stroke="#9333EA" stroke-width="2" />
      <text x="330" y="28" fill="#FFFFFF" font-size="13.5" font-weight="800" text-anchor="middle">TEMPORAL TRACK FUSION &amp; TRAJECTORY SMOOTHING</text>
      
      <g transform="translate(15, 42)">
        <rect width="200" height="54" rx="4" fill="#0B0318" stroke="#6D28D9" stroke-width="1" />
        <text x="100" y="22" fill="#06B6D4" font-size="10" font-weight="700" text-anchor="middle">Multi-Frame IoU Matching</text>
        <text x="100" y="40" fill="#C4B5FD" font-size="9" text-anchor="middle">Persistent Track ID Assignment</text>
      </g>
      
      <g transform="translate(230, 42)">
        <rect width="200" height="54" rx="4" fill="#0B0318" stroke="#6D28D9" stroke-width="1" />
        <text x="100" y="22" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">Label Probability Voting</text>
        <text x="100" y="40" fill="#C4B5FD" font-size="9" text-anchor="middle">Hysteresis filters flickering classes</text>
      </g>
      
      <g transform="translate(445, 42)">
        <rect width="200" height="54" rx="4" fill="#0B0318" stroke="#6D28D9" stroke-width="1" />
        <text x="100" y="22" fill="#F59E0B" font-size="10" font-weight="700" text-anchor="middle">Kalman Velocity Vector</text>
        <text x="100" y="40" fill="#C4B5FD" font-size="9" text-anchor="middle">Spatial heading &amp; speed calc</text>
      </g>
    </g>
    
    <path d="M 430 655 L 430 685" stroke="#10B981" stroke-width="2.5" marker-end="url(#arr)" />
    
    <!-- Output Egress -->
    <g transform="translate(160, 685)" filter="url(#shadow)">
      <rect width="540" height="55" rx="8" fill="#1C0E3F" stroke="#10B981" stroke-width="1.8" />
      <text x="270" y="26" fill="#FFFFFF" font-size="12.5" font-weight="800" text-anchor="middle">STRUCTURED DETECTION PAYLOAD &amp; WEBSOCKET HUD EGRESS</text>
      <text x="270" y="44" fill="#10B981" font-size="10.5" font-weight="600" text-anchor="middle">Class, Model, Confidence, BBox, Velocity &amp; Persistent Track ID</text>
    </g>
</svg>